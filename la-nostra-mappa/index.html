<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La nostra mappa</title>
<style>
/* Layout: una colonna centrata da "tavolo da gioco"; carte con bordo pieno e ombra netta, pallini come gettoni. */
:root {
  --bg: #f4ecdd;
  --surface: #fffaf0;
  --ink: #241d19;
  --ink-2: #6a5d52;
  --line: #ded0b8;
  --line-2: #cdbb9c;
  --p1: #8a3642;        /* bordeaux/terracotta */
  --p1-soft: #f0d8d4;
  --p2: #275f6d;        /* blu petrolio */
  --p2-soft: #d2e3e6;
  --ok: #5f8f68;
  --ok-soft: #dcebdc;
  --mid: #cf9a2e;
  --mid-soft: #f6e7bd;
  --talk: #c5563c;
  --talk-soft: #f7ddd3;
  --me: var(--ink);
  --me-soft: var(--line);
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 20px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--body);
  padding-inline: 16px;
  padding-block: 0;
  min-height: 100vh;
}
#app[data-who="p1"] { --me: var(--p1); --me-soft: var(--p1-soft); }
#app[data-who="p2"] { --me: var(--p2); --me-soft: var(--p2-soft); }

.wrap { max-width: 760px; margin: 0 auto; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--me); outline-offset: 2px; }
main:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px; min-height: 52px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .01em; white-space: nowrap; flex: none; }
.top-r { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who { flex: 0 1 auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; background: var(--me-soft); font-size: 14px; font-weight: 600; min-width: 0; }
.who i { width: 10px; height: 10px; border-radius: 50%; background: var(--me); flex: none; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 22vw; }
.link { background: none; border: 0; min-height: 44px; padding: 0 6px; color: var(--ink-2); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--ink); }

/* ---------- screens ---------- */
.screen { animation: rise .35s ease both; padding-bottom: 40px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 6vh; }
.center > * { max-width: 30rem; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.12; }
h1 { font-size: clamp(34px, 8vw, 52px); }
h2 { font-size: clamp(26px, 5.5vw, 34px); }
.lead { font-size: 18px; color: var(--ink-2); margin: 0; text-wrap: pretty; }
.small { font-size: 14px; color: var(--ink-2); margin: 0; }
.big-emoji { font-size: 44px; line-height: 1; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }

.btn { border: 0; border-radius: 99px; min-height: 52px; padding: 0 28px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 17px; box-shadow: 0 3px 0 rgba(0,0,0,.28); transition: transform .12s, box-shadow .12s, opacity .2s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
.btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
.btn.me { background: var(--me); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line-2); }
.btn.danger { background: var(--talk); color: #fff; }

.names { display: grid; gap: 12px; width: 100%; text-align: left; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field input, .field textarea { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); }
.field input::placeholder, .field textarea::placeholder { color: #a99a87; }
.field.p1 input { border-color: var(--p1-soft); }
.field.p2 input { border-color: var(--p2-soft); }

.hero-dots { display: flex; gap: 8px; }

/* ---------- pallini ---------- */
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--me); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 1px 1px rgba(0,0,0,.18); flex: none; }
.dot.p1 { background: var(--p1); }
.dot.p2 { background: var(--p2); }
.dot.lg { width: 22px; height: 22px; }
.dot.pop { animation: pop .25s ease; }
@keyframes pop { 0% { transform: scale(.2); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* ---------- round ---------- */
.pips { display: flex; justify-content: space-between; gap: 6px; padding-bottom: 6px; }
.pip { flex: 1; display: grid; place-items: center; height: 30px; border-radius: 10px; font-size: 16px; background: transparent; border: 1.5px dashed var(--line-2); filter: grayscale(1); opacity: .55; }
.pip.done { background: var(--me-soft); border: 1.5px solid transparent; filter: none; opacity: .9; }
.pip.now { background: var(--surface); border: 2px solid var(--me); filter: none; opacity: 1; box-shadow: 0 2px 0 var(--me); }

.tray-wrap { position: sticky; top: 0; z-index: 5; margin-inline: -16px; padding: 4px 16px 8px; background: linear-gradient(var(--bg) 85%, transparent); }
.tray-card { background: var(--surface); border: 2px solid var(--line-2); border-radius: 16px; box-shadow: 0 2px 0 var(--line-2); padding: 8px 12px; display: flex; align-items: center; gap: 12px; }
.tray-card.bump { animation: bump .3s; }
.tray-count { display: flex; align-items: baseline; gap: 5px; flex: none; white-space: nowrap; }
.tray-count b { font-family: var(--display); font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.2ch; text-align: right; }
.tray-count span { font-size: 13px; color: var(--ink-2); }
.tray { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; align-items: center; }
.tray i { width: 100%; max-width: 16px; justify-self: center; aspect-ratio: 1; border-radius: 50%; background: var(--me); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 1px 1px rgba(0,0,0,.18); transition: background .2s, box-shadow .2s, transform .2s; }
.tray i.spent { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); transform: scale(.8); }

.area-title { display: flex; align-items: center; gap: 12px; padding: 4px 0 10px; }
.area-title .em { font-size: 30px; line-height: 1; }
.area-title h2 { letter-spacing: .05em; text-transform: uppercase; font-size: clamp(20px, 5vw, 26px); }
.area-title p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }

.cats { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .cats { grid-template-columns: 1fr 1fr; } }
/* Altezza della carta = altezza della colonna verticale di 5 pallini (uguale per ogni voce) */
.cat { --dot: 15px; --gap: 6px; --pad: 11px; height: calc(5 * var(--dot) + 4 * var(--gap) + 2 * var(--pad) + 4px); display: grid; grid-template-columns: minmax(0, 1fr) auto; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); box-shadow: 0 2px 0 var(--line); overflow: hidden; transition: border-color .2s, background .2s; min-width: 0; }
.cat.has { border-color: var(--me); }
.cat.bump { animation: bump .3s; }
.body { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; align-items: start; padding: var(--pad) 6px var(--pad) 12px; height: 100%; min-width: 0; }
/* titolo e sottotitolo in alto; scala e valore dinamico ancorati in basso */
.txt { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; height: 100%; overflow: hidden; }
.head, .foot { display: grid; gap: 2px; min-width: 0; }
.label { font-weight: 600; font-size: 15.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.desc { font-style: italic; font-size: 12.5px; line-height: 1.3; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note .desc { font-size: 13px; white-space: normal; }
.anch { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 1.3; color: var(--ink-2); min-width: 0; }
.anch b { flex: none; min-width: 20px; text-align: center; padding: 0 3px; border-radius: 6px; background: var(--line); color: var(--ink); font-size: 11px; line-height: 1.5; }
.anch span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.anch.on { color: var(--ink); font-weight: 600; }
.anch.on b { background: var(--me); color: #fff; }
.now { display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 12px; line-height: 18px; font-weight: 600; color: var(--ink-2); min-width: 0; }
.now .n { flex: none; min-width: 22px; height: 18px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center; background: var(--line); color: var(--ink-2); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.now .lvl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cat.has .now { color: var(--me); }
.cat.has .now .n { background: var(--me); color: #fff; }
.slots { display: grid; grid-template-columns: repeat(2, var(--dot)); grid-template-rows: repeat(5, var(--dot)); grid-auto-flow: column; gap: var(--gap); }
.slots i { width: var(--dot); height: var(--dot); border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-2); transition: background .15s, box-shadow .15s; }
.slots i.on { background: var(--me); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 1px 1px rgba(0,0,0,.18); }
.slots i.pop { animation: pop .25s ease; }
.ctl { width: 52px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: var(--pad) 0; border-left: 2px solid var(--line); }
.rbtn { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; padding: 0 0 2px; font-size: 26px; line-height: 1; font-weight: 500; background: var(--surface); color: var(--ink); border: 2px solid var(--line-2); box-shadow: 0 2px 0 var(--line-2); transition: transform .1s, box-shadow .1s, opacity .2s, background .2s; }
.rbtn.plus { background: var(--me); border-color: var(--me); color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.28); }
.rbtn:hover:not(:disabled) { transform: translateY(-1px); }
.rbtn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.rbtn:disabled { opacity: .3; cursor: default; box-shadow: none; }

.bar { position: sticky; bottom: 0; z-index: 5; margin: 18px -16px 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bar .msg { margin: 0; font-weight: 600; color: var(--ink); min-height: 1.5em; flex: 1 1 160px; }
.bar .btn { flex: 1 1 220px; }

/* ---------- results ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.res-head { display: grid; gap: 14px; padding-block: 8px 20px; }
.areas { display: grid; gap: 18px; }
.area { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; box-shadow: 0 3px 0 var(--line); padding: 18px 16px 16px; display: grid; gap: 14px; }
.area-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.area-h .em { font-size: 28px; line-height: 1; }
.area-h h3 { letter-spacing: .06em; text-transform: uppercase; font-size: 20px; margin-right: auto; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: #3d6a47; }
.chip.mid { background: var(--mid-soft); color: #7d5a0c; }
.chip.talk { background: var(--talk-soft); color: #9a3720; }
.chip.none { background: var(--line); color: var(--ink-2); }
.cat-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rc { display: grid; gap: 6px; padding: 10px 12px 10px 14px; border-radius: 14px; border-left: 5px solid var(--line-2); background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
.rc.ok { border-left-color: var(--ok); }
.rc.mid { border-left-color: var(--mid); }
.rc.talk { border-left-color: var(--talk); }
.rc.none { border-left-color: var(--line-2); }
.rc-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rc-name { font-weight: 600; min-width: 0; }
.rc-h .chip { flex: none; font-size: 11.5px; padding: 2px 9px; }
.rc-tot { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rc-line { display: flex; align-items: center; gap: 10px; min-height: 16px; }
.rc-line .g { flex: 0 0 118px; display: flex; flex-wrap: wrap; gap: 2px; }
.rc-line .dot { width: 10px; height: 10px; }
.rc-line .zero { font-size: 12px; font-weight: 700; color: var(--ink-2); line-height: 12px; }
.rc-line em { font-size: 13px; color: var(--ink); min-width: 0; }
.rc-foot { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.area-f { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); border-top: 1.5px dashed var(--line-2); padding-top: 12px; }
.area-f b { color: var(--ink); }

.sec { display: grid; gap: 12px; margin-top: 36px; }
.sec h2 { font-size: clamp(22px, 5vw, 28px); }
.sec > p { margin: 0; color: var(--ink-2); }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.note { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 4px; }
.note.ok { border-color: var(--ok); }
.note.mid { border-color: var(--mid); }
.note.talk { border-color: var(--talk); }
.note b { font-size: 16px; }
.note span { font-size: 14px; color: var(--ink-2); }
.note em.desc { font-style: italic; }
.note .where { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.pair { display: grid; gap: 3px; margin-top: 2px; }
.lv { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink); }
.note .extra { font-size: 14px; color: var(--ink-2); }
.evs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.ev { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; background: var(--bg); font-size: 12px; font-variant-numeric: tabular-nums; }
.ev b { font-weight: 600; margin-right: 2px; }
.ev .dot { width: 9px; height: 9px; }
h3.sub { font-family: var(--body); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin-top: 8px; }
.how { font-size: 14px; color: var(--ink-2); background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 4px 14px; }
.how summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: 600; color: var(--ink); }
.how ul { margin: 0 0 10px; padding-left: 18px; display: grid; gap: 6px; }
.needs-h { font-size: 14px; }
.needs { display: flex; flex-wrap: wrap; gap: 8px; }
.needs span { padding: 6px 14px; border-radius: 99px; background: rgba(255,250,240,.14); border: 1.5px solid rgba(255,250,240,.28); font-size: 14px; color: var(--bg); }
.empty { font-size: 15px; color: var(--ink-2); padding: 14px 16px; border: 2px dashed var(--line-2); border-radius: 18px; }

.city { background: var(--ink); color: var(--bg); border-radius: 28px; padding: 26px 18px; display: grid; gap: 16px; margin-top: 44px; }
.city h2 { font-size: clamp(26px, 6vw, 36px); }
.city p { margin: 0; color: #d9ccb8; }
.city .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: rgba(255,250,240,.08); border: 1.5px solid rgba(255,250,240,.2); border-radius: 16px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.tile b { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.tile span { font-size: 13px; color: #d9ccb8; }
.city .q { font-family: var(--display); font-size: 20px; color: var(--bg); }
.city .field label { color: #d9ccb8; }
.city .field input { background: var(--surface); border-color: transparent; color: var(--ink); }

/* ---------- modale ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(36,29,25,.55); animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.dialog { background: var(--surface); border-radius: 24px; padding: 24px; max-width: 26rem; width: 100%; display: grid; gap: 20px; box-shadow: 0 10px 0 rgba(0,0,0,.15); animation: rise .25s both; }
.dialog p { margin: 0; font-family: var(--display); font-size: 21px; line-height: 1.3; }
.dialog .row { display: flex; gap: 10px; flex-wrap: wrap; }
.dialog .row .btn { flex: 1 1 120px; padding: 0 16px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
.pips-h { display: none; flex: 0 1 300px; padding: 0; }
.pips-h .pip { height: 30px; }
@media (min-width: 640px) {
  .pips-h { display: flex; }
  .pips-s { display: none; }
}
@media (max-width: 420px) {
  .tray-card { gap: 8px; padding: 8px 10px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* =====================================================================
   CONFIGURAZIONE — modifica qui aree, categorie e numero di pallini.
   ===================================================================== */
const POINTS = 20;
const MAX_PER_ITEM = 10;   // tetto per singola voce (blocco 2×5)
/* Ogni voce ha un titolo (max 3 parole), una definizione e 5 livelli concreti della scala 0–10:
   0 pallini | 1–3 | 4–6 | 7–9 | 10 pallini.   Più pallini = più di quella cosa nella vostra vita.
   crit = tema di fondo: pesa di più quando emerge una differenza. */
const it = (t, d, l, crit = false) => ({ t, d, l, crit });
const levelIdx = n => n <= 0 ? 0 : n >= MAX_PER_ITEM ? 4 : n <= 3 ? 1 : n <= 6 ? 2 : 3;
const levelText = (item, n) => item.l[levelIdx(n)];
const AREAS = [
  { id: "family", emoji: "👨‍👩‍👧", name: "Famiglia", items: [
    it("Vicinanza alle famiglie", "Distanza dalle famiglie",
       ["Oltre 3 ore di viaggio", "Fino a 3 ore di viaggio", "Entro 1–2 ore", "Entro 30–45 minuti", "Nello stesso quartiere"], true),
    it("Contatto costante", "Frequenza di visite e chiamate",
       ["Solo nelle occasioni", "Una volta al mese", "Ogni settimana", "Più volte a settimana", "Ogni giorno"]),
    it("Cura dei genitori", "Impegno quando invecchiano",
       ["Nessun impegno diretto", "Aiuto economico se serve", "Presenza regolare", "Aiuto pratico costante", "Accoglierli in casa nostra"]),
    it("Feste e rituali", "Ricorrenze passate insieme",
       ["Nessuna in particolare", "Solo le più importanti", "Circa metà delle feste", "Quasi tutte le feste", "Ogni festa e ricorrenza"]),
    it("Rapporto coi suoceri", "Tempo e confidenza con loro",
       ["Rapporto formale", "Cordiale, poco frequente", "Confidenza e visite fisse", "Molto vicini, vita comune", "Come di famiglia"]),
    it("Famiglia allargata", "Fratelli, cugini e zii",
       ["Solo la famiglia stretta", "Qualche incontro all'anno", "Un ritrovo al mese", "Un ritrovo a settimana", "Sempre insieme, un clan"]),
    it("Confini di coppia", "Autonomia dalle famiglie",
       ["Decidono con noi", "Le ascoltiamo su tutto", "Ascoltiamo e decidiamo", "Decidiamo e informiamo", "Decidiamo solo in due"]),
    it("Le nostre tradizioni", "Rituali tutti nostri",
       ["Solo quelle di famiglia", "Qualche rito tutto nostro", "Un mix con le nostre", "Molte abitudini nostre", "Un calendario tutto nostro"]) ] },
  { id: "children", emoji: "👶", name: "Figli", items: [
    it("Desiderio di figli", "Quanto forte è il desiderio",
       ["Non ne voglio", "Ci sto ancora pensando", "Mi piacerebbe", "Lo desidero molto", "È un progetto centrale"], true),
    it("Quando cominciare", "Quando iniziare a provarci",

   phase: setup | player1 | handoff | player2 | ready | results
   step (dentro player1/player2): intro | round

function freshState() {
  return {
    phase: "setup",

    cityNote: "",
    players: {

      player2: { name: "", rounds: {} }
    }

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pl = (n, one, many) => n === 1 ? one : many;
const sum = a => a.reduce((x, y) => x + y, 0);
const nameOf = k => (state.players[k].name || "").trim() || DEFAULT_NAMES[k];

function render() {
  const who = turnKey();
  $app.dataset.who = who === "player1" ? "p1" : who === "player2" ? "p2" : "";
  let body;
  switch (state.phase) {
    case "setup":   body = viewSetup(); break;
    case "player1":
    case "player2": body = state.step === "intro" ? viewTurnIntro(who) : viewRound(who); break;
    case "handoff": body = viewHandoff(); break;
    case "ready":   body = viewReady(); break;
    case "results": body = viewResults(); break;
  }
  $app.innerHTML = `<div class="wrap">${header(who)}<main id="main" tabindex="-1">${body}</main></div>`;
  if (state.phase === "player1" || state.phase === "player2") if (state.step === "round") updateRound();
  window.scrollTo(0, 0);
  const m = document.getElementById("main");
  if (m && state.phase !== "setup") m.focus({ preventScroll: true });
}

/* aggiornamento "in place" della schermata di round, senza ricostruirla */
function updateRound(popIndex = -1) {
  const d = state.draft, left = POINTS - sum(d);
  document.getElementById("left").textContent = left;
  document.getElementById("leftLbl").textContent = pl(left, "rimasto", "rimasti");
  document.querySelectorAll("#tray i").forEach((el, i) => el.classList.toggle("spent", i >= left));
  document.querySelectorAll(".cat").forEach(li => {
    const i = +li.dataset.i, n = d[i];
    li.classList.toggle("has", n > 0);
    const item = AREAS[state.currentRound].items[i], lvl = levelText(item, n);
    li.querySelector(".n").textContent = n;
    li.querySelector(".lvl").textContent = lvl;
    li.querySelectorAll(".anch").forEach(an => an.classList.toggle("on", levelIdx(n) === +an.dataset.end));
    const plus = li.querySelector(".plus"), minus = li.querySelector(".minus");
    plus.disabled = n >= MAX_PER_ITEM || left === 0;
    minus.disabled = n === 0;
    plus.setAttribute("aria-label", `Aggiungi un pallino: ${item.t}. Ora ${n} su ${MAX_PER_ITEM}, ${lvl}`);
    minus.setAttribute("aria-label", `Togli un pallino: ${item.t}. Ora ${n} su ${MAX_PER_ITEM}, ${lvl}`);
    li.querySelectorAll(".slots i").forEach((dot, k) => {
      dot.className = (k < n ? "on" : "") + (i === popIndex && k === n - 1 ? " pop" : "");
    });
  });
  document.getElementById("msg").textContent = left === 0 ? "Hai distribuito tutti i pallini." : "";
  document.getElementById("confirm").disabled = left !== 0;
}

/* =====================================================================
   RISULTATI (l'unica schermata che legge i dati di entrambi)
   ===================================================================== */
const KIND = {
  pillar:    { cls: "ok",   label: "Pilastro condiviso" },
  sync:      { cls: "ok",   label: "In sintonia" },
  quiet:     { cls: "none", label: "Poco in gioco" },
  nuance:    { cls: "mid",  label: "Sfumatura" },
  negotiate: { cls: "mid",  label: "Da negoziare" },
  knot:      { cls: "talk", label: "Punto da discutere" }
};
const AREA_LABEL = { ok: "Molto allineati", mid: "Sfumature diverse", talk: "Da scoprire insieme" };

/* Quando una voce è ok e quando no. a, b = pallini (0–10) dei due giocatori sulla stessa voce.
   - poco in gioco : nessuno dei due supera T.quiet
   - in sintonia   : distanza ≤ T.aligned (pilastro condiviso se entrambi ≥ T.pillar)
   - sfumatura     : distanza ≤ T.nuance   → ciascuno si sposta di al massimo 2 pallini per incontrarsi
   - da negoziare  : distanza ≤ T.negotiate → il punto d'incontro è a una fascia intera di distanza
   - da discutere  : distanza maggiore, posizioni agli estremi della scala */
function classify(a, b) {
  const diff = Math.abs(a - b), hi = Math.max(a, b), lo = Math.min(a, b);
  if (hi <= T.quiet) return "quiet";
  if (diff <= T.aligned) return lo >= T.pillar ? "pillar" : "sync";
  if (diff <= T.nuance) return "nuance";
  if (diff <= T.negotiate) return "negotiate";
  return "knot";
}

function analyse() {
  const r1 = state.players.player1.rounds, r2 = state.players.player2.rounds;
  const areas = AREAS.map(area => {
    const cats = area.items.map((item, i) => {
      const a = r1[area.id][i], b = r2[area.id][i];
      return { item, area, i, a, b, lo: Math.min(a, b), hi: Math.max(a, b), diff: Math.abs(a - b),
               avg: (a + b) / 2, total: a + b, kind: classify(a, b) };
    });
    const has = k => cats.some(c => c.kind === k);
    const nuances = cats.filter(c => c.kind === "nuance").length;
    return { ...area, cats: [...cats].sort((x, y) => y.total - x.total || x.i - y.i),
             level: has("knot") ? "talk" : has("negotiate") || nuances >= 3 ? "mid" : "ok" };
  });
  const all = areas.flatMap(a => a.cats);
  const get = (id, i) => all.find(c => c.area.id === id && c.i === i);

  const aligned = all.filter(c => (c.kind === "pillar" || c.kind === "sync") && c.lo >= 2)
    .sort((x, y) => (y.kind === "pillar") - (x.kind === "pillar") || y.lo - x.lo || y.hi - x.hi).slice(0, 3);
  const discuss = all.filter(c => c.kind === "knot" || c.kind === "negotiate")
    .sort((x, y) => (y.kind === "knot") - (x.kind === "knot") || y.item.crit - x.item.crit || y.diff - x.diff || y.hi - x.hi).slice(0, 3);
  const different = all.filter(c => ["nuance", "negotiate", "knot"].includes(c.kind) && !discuss.includes(c))
    .sort((x, y) => y.diff - x.diff || y.hi - x.hi).slice(0, 3);
  return { areas, all, get, aligned, discuss, different, ...crossings(get), needs: placeNeeds(get) };
}

/* Incroci: combinazioni di voci diverse che insieme producono un esito.
   Le soglie usano i valori di entrambi (hi = il più alto dei due, lo = il più basso, avg = media). */
function crossings(get) {
  const fam = i => get("family", i), chi = i => get("children", i), fri = i => get("friends", i),
        mon = i => get("money", i), car = i => get("career", i), tl = i => get("freeTime", i);
  const N = { a: esc(nameOf("player1")), b: esc(nameOf("player2")) };
  const lv = (c, n) => `«${esc(levelText(c.item, Math.round(n)))}»`;
  const found = [];
  const add = (type, title, text, refs) => found.push({ type, title, text, refs,
    strength: refs.reduce((s, c) => s + c.hi, 0) });

  /* — Da mettere in relazione — */
  for (const [x, y] of [["a", "b"], ["b", "a"]]) {
    if (Math.max(fam(0)[x], fri(0)[x]) >= 7 && car(5)[y] >= 7 && !found.some(f => f.title === "Radici e movimento"))
      add("tension", "Radici e movimento",
        `${N[x]} vuole restare vicino a famiglia e amici, ${N[y]} è pronto a spostarsi per lavoro. Un luogo ben collegato può tenere insieme le due cose?`,
        [fam(0), fri(0), car(5)]);
  }
  if (car(0).hi >= 7 && chi(3).hi >= 7 && chi(5).avg <= 6)
    add("tension", "Ambizione e presenza",
      `Un ruolo ambizioso e tanta presenza quotidiana con i figli chiedono una regia chiara. La divisione della cura che immaginate (in media ${lv(chi(5), chi(5).avg)}) lascia spazio a entrambe le cose?`,
      [car(0), chi(3), chi(5)]);
  if (mon(4).hi >= 7 && mon(1).hi >= 7)
    add("tension", "Spendere e risparmiare",
      `Volete godervi i soldi e metterne da parte molti allo stesso tempo. Il budget può bastare a entrambe le cose, o una delle due va ridimensionata?`,
      [mon(4), mon(1)]);
  if (mon(5).hi >= 7 && car(1).hi <= 3)
    add("tension", "Libertà dal lavoro e reddito",
      `Smettere di lavorare presto (in media ${lv(mon(5), mon(5).avg)}) senza far crescere il reddito: come ci si arriva?`,
      [mon(5), car(1)]);
  if (car(3).avg >= 7 && car(0).hi >= 7)
    add("tension", "Orari leggeri e ruolo alto",
      `Orari sostenibili e un ruolo di grande responsabilità raramente convivono. Quale dei due lasciereste andare per primo?`,
      [car(3), car(0)]);
  if (chi(1).hi >= 7 && chi(6).avg >= 6 && fam(0).avg <= 3)
    add("tension", "Figli presto, famiglie lontane",
      `Pensate ai figli a breve e a un buon aiuto esterno, ma le famiglie d'origine sarebbero lontane (in media ${lv(fam(0), fam(0).avg)}). Chi potrebbe fare da rete?`,
      [chi(1), chi(6), fam(0)]);
  if (chi(0).hi >= 6 && mon(6).hi >= 6 && mon(1).avg <= 3)
    add("tension", "Figli e risparmi",
      `Un progetto di figli con risorse dedicate, ma poca abitudine a risparmiare. Cosa dovrebbe cambiare, e da quando?`,
      [chi(0), mon(6), mon(1)]);
  if (car(6).lo >= 6 && car(5).hi >= 7)
    add("tension", "Due carriere, un trasferimento",
      `Entrambe le carriere contano e almeno uno è pronto a spostarsi. Serve un luogo dove ci sia lavoro per tutti e due.`,
      [car(6), car(5)]);
  if (car(7).hi >= 7 && car(6).lo >= 6)
    add("tension", "Passo indietro e doppia carriera",
      `Uno di voi è pronto a rallentare molto, ma entrambi tenete alla doppia carriera. Chi, quando e per quanto?`,
      [car(7), car(6)]);
  if (mon(3).hi >= 7 && car(5).hi >= 7)
    add("tension", "Casa e mobilità",
      `Comprare casa presto e spostarsi per lavoro tirano in direzioni opposte: una casa di proprietà lega a un luogo.`,
      [mon(3), car(5)]);

  /* — Si rinforzano — */
  if (fam(0).lo >= 6 && fri(0).lo >= 6)
    add("synergy", "Radici condivise",
      `Entrambi volete restare vicini a famiglia e amici di sempre: il luogo può diventare il vostro punto fermo.`, [fam(0), fri(0)]);
  if (car(5).lo >= 6 && tl(0).lo >= 6)
    add("synergy", "Vita in movimento",
      `Entrambi siete pronti a spostarvi e a viaggiare molto: vi muovete con lo stesso passo.`, [car(5), tl(0)]);
  if (tl(7).lo >= 6 && tl(3).lo >= 5 && car(3).lo >= 5)
    add("synergy", "Ritmi lenti e natura",
      `Entrambi cercate agenda leggera, orari sostenibili e tempo all'aperto: uno stile di vita coerente.`, [tl(7), tl(3), car(3)]);
  if (fri(4).lo >= 5 && mon(3).lo >= 5 && fri(2).lo >= 4)
    add("synergy", "Casa come punto d'incontro",
      `Una casa vostra, aperta agli amici e alle altre coppie: un desiderio che condividete.`, [fri(4), mon(3), fri(2)]);
  if (chi(0).lo >= 6 && chi(3).lo >= 5 && chi(5).lo >= 5)
    add("synergy", "Famiglia al centro",
      `Entrambi desiderate dei figli, volete esserci ogni giorno e dividervi la cura in modo simile.`, [chi(0), chi(3), chi(5)]);
  if (car(6).lo >= 7 && car(1).lo >= 4)
    add("synergy", "Due carriere ambiziose",
      `Entrambi volete una doppia carriera che cresca: un progetto comune, non una concessione.`, [car(6), car(1)]);
  if (mon(0).lo >= 6 && mon(1).lo >= 5)
    add("synergy", "Base finanziaria solida",
      `Entrambi date valore a un cuscinetto e al risparmio regolare: le decisioni economiche partono da un terreno comune.`, [mon(0), mon(1)]);
  if (tl(6).lo >= 6 && tl(1).lo >= 5)
    add("synergy", "Tempo per noi",
      `Entrambi volete serate e fughe pensate per la coppia: un'abitudine da proteggere anche quando la vita si riempie.`, [tl(6), tl(1)]);

  const by = t => found.filter(f => f.type === t).sort((x, y) => y.strength - x.strength);
  return { tensions: by("tension").slice(0, 4), synergies: by("synergy").slice(0, 3) };
}

/* Requisiti del luogo: cosa dovrebbe permettere, non quale città scegliere. */
function placeNeeds(get) {
  const fam = i => get("family", i), chi = i => get("children", i), fri = i => get("friends", i),
        mon = i => get("money", i), car = i => get("career", i), tl = i => get("freeTime", i);
  const m = (...v) => Math.max(...v);
  return [
    [fam(0).avg >= 6,                                           "Vicino alle famiglie",               fam(0).avg],
    [car(5).hi >= 7 || tl(0).avg >= 6,                          "Ben collegato: aeroporto e treni",   m(car(5).hi, tl(0).avg)],
    [car(6).avg >= 6,                                           "Lavoro per due carriere",            car(6).avg],
    [m(fri(1).avg, fri(4).avg) >= 5 || fri(2).avg >= 4,         "Amici e comunità in cui inserirsi",  m(fri(1).avg, fri(4).avg, fri(2).avg)],
    [m(mon(0).avg, mon(1).avg) >= 5 || mon(3).avg >= 6,         "Costo della vita sostenibile",       m(mon(0).avg, mon(1).avg, mon(3).avg)],
    [m(tl(3).avg, tl(7).avg) >= 5,                              "Natura a portata di mano",           m(tl(3).avg, tl(7).avg)],
    [m(tl(4).avg, fri(5).avg) >= 5,                             "Cultura e vita sociale",             m(tl(4).avg, fri(5).avg)],
    [chi(0).avg >= 5,                                           "Scuole e servizi per famiglie",      chi(0).avg]
  ].filter(x => x[0]).sort((x, y) => y[2] - x[2]).slice(0, 6).map(x => x[1]);
}

function viewResults() {
  const n1 = esc(nameOf("player1")), n2 = esc(nameOf("player2"));
  const { areas, aligned, discuss, different, tensions, synergies, needs } = analyse();
  const lvA = c => `«${esc(levelText(c.item, c.a))}»`, lvB = c => `«${esc(levelText(c.item, c.b))}»`;
  const mid = c => `«${esc(levelText(c.item, Math.round(c.avg)))}»`;

  const areaCards = areas.map(area => {
    const rows = area.cats.map(c => {
      const k = KIND[c.kind];
      const g = (n, cls) => `<span class="g">${n ? dots(n, cls) : '<span class="zero">0</span>'}</span>`;
      return `<li class="rc ${k.cls}">
        <div class="rc-h"><span class="rc-name">${esc(c.item.t)}</span><span class="chip ${k.cls}">${k.label}</span></div>
        <div class="rc-line" role="img" aria-label="${n1}: ${c.a}, ${esc(levelText(c.item, c.a))}">${g(c.a, "p1")}<em>${lvA(c)}</em></div>
        <div class="rc-line" role="img" aria-label="${n2}: ${c.b}, ${esc(levelText(c.item, c.b))}">${g(c.b, "p2")}<em>${lvB(c)}</em></div>
        <div class="rc-foot">${c.total} ${pl(c.total, "pallino totale", "pallini totali")}</div>
      </li>`;
    }).join("");
    const top = area.cats[0], gap = [...area.cats].sort((x, y) => y.diff - x.diff)[0];
    return `<article class="area">
      <div class="area-h"><span class="em" aria-hidden="true">${area.emoji}</span><h3>${esc(area.name)}</h3>
        <span class="chip ${area.level}">${AREA_LABEL[area.level]}</span></div>
      <ul class="cat-list">${rows}</ul>
      <div class="area-f">
        <span>Voce con più peso: <b>${esc(top.item.t)}</b> (${top.total})</span>
        <span>${gap.diff >= T.negotiate - 1
          ? `Differenza maggiore: <b>${esc(gap.item.t)}</b> (${gap.a} contro ${gap.b})`
          : "Nessuna differenza marcata in quest'area."}</span>
      </div></article>`;
  }).join("");

  const pair = c => `<span class="pair"><span class="lv"><i class="dot p1"></i>${n1}: ${lvA(c)}</span><span class="lv"><i class="dot p2"></i>${n2}: ${lvB(c)}</span></span>`;
  const hiName = c => esc(nameOf(c.a >= c.b ? "player1" : "player2")), loName = c => esc(nameOf(c.a >= c.b ? "player2" : "player1"));
  const extra = c => {
    if (c.kind === "pillar") return "Un pilastro su cui costruire.";
    if (c.kind === "sync") return "Scelte vicine: nessuna tensione su questo punto.";
    if (c.kind === "nuance") return `Punto d'incontro naturale: ${mid(c)}. Ciascuno si sposta al massimo di 2 pallini.`;
    if (c.kind === "negotiate") return c.lo <= 2
      ? `Per ${loName(c)} conta poco: può essere una concessione semplice e importante per ${hiName(c)}.`
      : `Servirà un compromesso a metà scala, intorno a ${mid(c)}.`;
    return `${c.item.crit ? "Tema di fondo. " : ""}Il punto medio (${mid(c)}) potrebbe non soddisfare nessuno dei due: vale la pena capire cosa c'è dietro ciascuna scelta.`;
  };
  const noteHtml = c => `<li class="note ${KIND[c.kind].cls}">
    <span class="where">${c.area.emoji} ${esc(c.area.name)}</span><b>${esc(c.item.t)}</b>
    <em class="desc">${esc(c.item.d)}</em>${pair(c)}<span class="extra">${extra(c)}</span></li>`;
  const list = (arr, empty) => arr.length ? arr.map(noteHtml).join("") : `<li class="empty">${empty}</li>`;

  const ev = c => `<span class="ev"><b>${esc(c.item.t)}</b><i class="dot p1"></i>${c.a}<i class="dot p2"></i>${c.b}</span>`;
  const crossHtml = (arr, cls, empty) => arr.length ? arr.map(f => `<li class="note ${cls}">
    <b>${esc(f.title)}</b><span class="extra">${f.text}</span><span class="evs">${f.refs.map(ev).join("")}</span></li>`).join("")
    : `<li class="empty">${empty}</li>`;

  const tiles = areas.map(a => {
    const top = a.cats[0];
    return `<div class="tile"><b>${a.emoji} ${esc(a.name)}</b><span>${top.total ? `${esc(top.item.t)}: ${mid(top)}` : "—"}</span></div>`;
  }).join("");

  return `<section class="screen">
    <div class="res-head">
      <h1>La vostra mappa</h1>
      <p class="lead">Nessun vincitore: ogni voce ha una scala concreta e qui vedete dove le vostre posizioni si incontrano.</p>
      <div class="legend">
        <span><i class="dot p1"></i>${n1}</span><span><i class="dot p2"></i>${n2}</span>
        <span class="chip ok">In sintonia</span><span class="chip mid">Sfumatura</span><span class="chip talk">Punto da discutere</span><span class="chip none">Poco in gioco</span>
      </div>
      <details class="how"><summary>Come leggiamo i risultati</summary>
        <ul>
          <li><b>In sintonia</b>: la distanza tra i vostri pallini è ${T.aligned} o meno. Se entrambi siete a ${T.pillar} o più, è un <b>pilastro condiviso</b>.</li>
          <li><b>Sfumatura</b>: distanza di ${T.aligned + 1}–${T.nuance}. Per incontrarvi ciascuno si sposta al massimo di 2 pallini, restando nella stessa fascia della scala.</li>
          <li><b>Da negoziare</b>: distanza di ${T.nuance + 1}–${T.negotiate}. Il punto d'incontro è a una fascia intera di distanza per ciascuno.</li>
          <li><b>Punto da discutere</b>: distanza di ${T.negotiate + 1} o più. Le posizioni stanno agli estremi della scala.</li>
          <li><b>Poco in gioco</b>: nessuno dei due supera ${T.quiet} pallini. Non serve parlarne.</li>
          <li>Le voci si leggono anche <b>in combinazione</b>: sotto trovate gli incroci che rinforzano o mettono in tensione le vostre scelte.</li>
        </ul>
      </details>
    </div>
    <div class="areas">${areaCards}</div>

    <div class="sec"><h2>🟢 Dove siamo già molto allineati</h2><ul class="notes">${list(aligned, "Nessuna coincidenza netta questa volta. Le sfumature qui sotto sono un buon punto di partenza.")}</ul></div>
    <div class="sec"><h2>🟡 Dove abbiamo priorità diverse</h2><ul class="notes">${list(different, "Nessun'altra differenza di rilievo. Le priorità sono vicine.")}</ul></div>
    <div class="sec"><h2>💬 Di cosa vale la pena parlare</h2>
      <p>Sono le distanze più grandi. Potrebbe essere una cosa interessante da capire insieme.</p>
      <ul class="notes">${list(discuss, "Non emergono differenze forti: potete usare il tempo per raccontarvi cosa c'è dietro le scelte comuni.")}</ul></div>

    <div class="sec"><h2>🔗 Dove le scelte si incrociano</h2>
      <p>Le voci non vivono da sole. Alcune combinazioni si rinforzano, altre chiedono di essere messe in relazione.</p>
      <h3 class="sub">Si rinforzano</h3><ul class="notes">${crossHtml(synergies, "ok", "Nessuna combinazione forte in comune, per ora.")}</ul>
      <h3 class="sub">Da mettere in relazione</h3><ul class="notes">${crossHtml(tensions, "mid", "Nessun incrocio in tensione: le vostre scelte si compongono senza attriti evidenti.")}</ul></div>

    <div class="city">
      <h2>🏠 E quindi… dove?</h2>
      <p>La città non era una scelta del gioco. È una conseguenza delle priorità che avete appena espresso.</p>
      <div class="tiles">${tiles}</div>
      ${needs.length ? `<p class="needs-h">Il luogo dovrebbe permettervi:</p><div class="needs">${needs.map(n => `<span>${esc(n)}</span>`).join("")}</div>` : ""}
      <p class="q">Quale tipo di città ci permette di far funzionare meglio questa combinazione?</p>
      <div class="field"><label for="city">La prima città che ci viene in mente:</label>
        <input id="city" maxlength="80" autocomplete="off" value="${esc(state.cityNote)}"></div>
    </div>
    <div class="center" style="padding-top:36px"><button class="btn ghost" data-action="ask-reset">Ricomincia</button></div>
  </section>`;
}

/* =====================================================================
   AZIONI
   ===================================================================== */
function addDot(i) {
  if (!state.draft) return;
  if (sum(state.draft) >= POINTS) { bump(document.getElementById("trayCard")); return; }
  if (state.draft[i] >= MAX_PER_ITEM) { bump(document.querySelector(`.cat[data-i="${i}"]`)); return; }
  state.draft[i]++;
  updateRound(i);
}
function subDot(i) {
  if (!state.draft || state.draft[i] <= 0) return;
  state.draft[i]--;
  updateRound();
}
function bump(el) { if (!el) return; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

function confirmRound() {
  const who = turnKey();
  if (!who || state.step !== "round" || !state.draft || sum(state.draft) !== POINTS) return;
  const area = AREAS[state.currentRound];
  state.players[who].rounds[area.id] = state.draft.slice();   // da qui l'area è congelata
  state.draft = null;
  state.currentRound++;
  if (state.currentRound < AREAS.length) {
    state.draft = new Array(AREAS[state.currentRound].items.length).fill(0);
  } else {
    state.phase = who === "player1" ? "handoff" : "ready";
    state.step = "intro";
  }
  render();
}

function openResetDialog() {
  if (document.getElementById("modal")) return;
  const el = document.createElement("div");
  el.className = "scrim"; el.id = "modal";
  el.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="mt">
    <p id="mt">Vuoi davvero ricominciare? Tutte le scelte verranno cancellate.</p>
    <div class="row"><button class="btn ghost" data-action="cancel-reset">Annulla</button>
    <button class="btn danger" data-action="do-reset">Ricomincia</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector('[data-action="cancel-reset"]').focus();
}
function closeDialog() { const m = document.getElementById("modal"); if (m) m.remove(); }

/* Reset reale: sostituisce l'intero oggetto di stato, poi ridisegna da zero. */
function resetAll() {
  state = freshState();
  closeDialog();
  render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const i = +t.dataset.i;
  switch (t.dataset.action) {
    case "start": {
      const n1 = document.getElementById("name1"), n2 = document.getElementById("name2");
      state.players.player1.name = n1 ? n1.value.trim() : "";
      state.players.player2.name = n2 ? n2.value.trim() : "";
      state.phase = "player1"; state.step = "intro"; render(); break;
    }
    case "begin-turn":
      state.step = "round"; state.currentRound = 0;
      state.draft = new Array(AREAS[0].items.length).fill(0); render(); break;
    case "add": addDot(i); break;
    case "sub": subDot(i); break;
    case "confirm": confirmRound(); break;
    case "handoff": state.phase = "player2"; state.step = "intro"; state.currentRound = 0; render(); break;
    case "reveal": state.phase = "results"; render(); break;
    case "ask-reset": openResetDialog(); break;
    case "cancel-reset": closeDialog(); break;
    case "do-reset": resetAll(); break;
  }
});
document.addEventListener("input", e => { if (e.target.id === "city") state.cityNote = e.target.value; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDialog();
});

render();
</script>
</body>
</html>
