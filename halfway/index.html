<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halfway</title>
<style>
/* Layout: una colonna centrata da "tavolo da gioco"; carte con bordo pieno e ombra netta, pallini come gettoni. */
:root {
  --bg: #f4ecdd;
  --surface: #fffaf0;
  --ink: #241d19;
  --ink-2: #6a5d52;
  --line: #ded0b8;
  --line-2: #cdbb9c;
  --p1: #8a3642;        /* bordeaux/terracotta */
  --p1-soft: #f0d8d4;
  --p2: #275f6d;        /* blu petrolio */
  --p2-soft: #d2e3e6;
  --ok: #5f8f68;
  --ok-soft: #dcebdc;
  --mid: #cf9a2e;
  --mid-soft: #f6e7bd;
  --talk: #c5563c;
  --talk-soft: #f7ddd3;
  --me: var(--ink);
  --me-soft: var(--line);
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 20px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--body);
  padding-inline: 16px;
  padding-block: 0;
  min-height: 100vh;
}
#app[data-who="p1"] { --me: var(--p1); --me-soft: var(--p1-soft); }
#app[data-who="p2"] { --me: var(--p2); --me-soft: var(--p2-soft); }

.wrap { max-width: 1120px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
main { flex: 1; display: flex; flex-direction: column; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--me); outline-offset: 2px; }
main:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px; min-height: 52px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .01em; white-space: nowrap; flex: none; }
.logo { display: inline-flex; align-items: center; }
.logo .dot { width: 11px; height: 11px; }
.lg-bar { width: 12px; height: 5px; margin: 0 -2px; background: var(--mid); border-radius: 3px; }
.logo.big .dot { width: 24px; height: 24px; }
.logo.big .lg-bar { width: 44px; height: 9px; margin: 0 -3px; transform-origin: center; animation: grow 1.1s ease-out both; }
.logo.big .dot.p1 { animation: meetL 1.1s cubic-bezier(.2,.9,.3,1.2) both; }
.logo.big .dot.p2 { animation: meetR 1.1s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes meetL { from { transform: translateX(-46px); } }
@keyframes meetR { from { transform: translateX(46px); } }
@keyframes grow { from { transform: scaleX(0); } }
.toast { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 20px; border-radius: 99px; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 0 rgba(0,0,0,.25); animation: toast 1.9s ease both; }
@keyframes toast { 0% { transform: translate(-50%, -34px); opacity: 0; } 12%, 80% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -34px); opacity: 0; } }
.top-r { display: flex; align-items: center; gap: 6px; min-width: 0; }
.who { flex: 0 1 auto; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 99px; background: var(--me-soft); font-size: 13px; font-weight: 600; min-width: 0; }
.who i { width: 10px; height: 10px; border-radius: 50%; background: var(--me); flex: none; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 38vw; }
.reset { position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 99px; border: 2px solid var(--line-2); background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 600; line-height: 1; transition: color .15s, border-color .15s, transform .1s; }
.reset::before { content: ""; position: absolute; inset: -6px -2px; }  /* area di tocco ≥ 44px */
.reset svg { width: 14px; height: 14px; }
.reset:hover { color: var(--talk); border-color: var(--talk); }
.reset:active { transform: translateY(1px); }

/* ---------- screens ---------- */
.screen { animation: rise .35s ease both; padding-bottom: 40px; flex: 1; display: flex; flex-direction: column; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* schermate centrali: contenuto nel mezzo della pagina (il padding in basso compensa l'header) */
.center { text-align: center; align-items: center; justify-content: center; gap: 20px; padding-bottom: 64px; }
.center > * { max-width: 30rem; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.12; }
h1 { font-size: clamp(34px, 8vw, 52px); }
h2 { font-size: clamp(26px, 5.5vw, 34px); }
.lead { font-size: 18px; color: var(--ink-2); margin: 0; text-wrap: pretty; }
.small { font-size: 14px; color: var(--ink-2); margin: 0; }
.big-emoji { font-size: 44px; line-height: 1; }
.trans { align-items: center; justify-content: center; text-align: center; animation: none; padding-bottom: 64px; }
.trans h1 { font-size: clamp(38px, 11vw, 68px); animation: transIn 2s ease both; }
@keyframes transIn { 0% { opacity: 0; transform: scale(.94); } 16%, 84% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(1.03); } }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }

.btn { border: 0; border-radius: 99px; min-height: 52px; padding: 0 28px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 17px; box-shadow: 0 3px 0 rgba(0,0,0,.28); transition: transform .12s, box-shadow .12s, opacity .2s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
.btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
.btn.me { background: var(--me); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line-2); }
.btn.danger { background: var(--talk); color: #fff; }

.lang { display: inline-flex; padding: 4px; gap: 4px; border-radius: 99px; background: var(--surface); border: 2px solid var(--line); }
.lg { border: 0; background: none; min-height: 40px; padding: 0 18px; border-radius: 99px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.lg.on { background: var(--ink); color: var(--bg); }
.names { display: grid; gap: 10px; width: 100%; max-width: 20rem; text-align: left; }
.name { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 99px; border: 2px solid var(--line); background: var(--surface); transition: border-color .15s; }
.name.p1:focus-within { border-color: var(--p1); } .name.p2:focus-within { border-color: var(--p2); }
.name input { flex: 1; min-width: 0; border: 0; background: none; padding: 0; font-size: 17px; font-weight: 600; outline: none; }
.name input::placeholder { color: #a99a87; font-weight: 500; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field input, .field textarea { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); }
.field input::placeholder, .field textarea::placeholder { color: #a99a87; }
.field.p1 input { border-color: var(--p1-soft); }
.field.p2 input { border-color: var(--p2-soft); }

.hero-dots { display: flex; gap: 8px; }

/* ---------- pallini ---------- */
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--me); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 1px 1px rgba(0,0,0,.18); flex: none; }
.dot.p1 { background: var(--p1); }
.dot.p2 { background: var(--p2); }
.dot.lg { width: 22px; height: 22px; }
.dot.pop { animation: pop .25s ease; }
@keyframes pop { 0% { transform: scale(.2); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* ---------- round ---------- */
.pips { display: flex; justify-content: space-between; gap: 6px; padding-block: 7px 6px; }
.pip { flex: 1; display: grid; place-items: center; height: 34px; border-radius: 12px; font-size: 18px; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; background: transparent; border: 2px solid var(--line); opacity: .5; }
.pip { position: relative; }
.pip.done { background: var(--me-soft); border-color: transparent; opacity: 1; }
.pip.done::after { content: "✓"; position: absolute; right: -3px; top: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--me); color: #fff; font: 700 10px/16px system-ui, sans-serif; text-align: center; }
@keyframes pulse { 50% { box-shadow: 0 2px 0 var(--me), 0 0 0 5px color-mix(in srgb, var(--me) 20%, transparent); } }
.pip.now { background: var(--surface); border-color: var(--me); opacity: 1; box-shadow: 0 2px 0 var(--me); animation: pulse 1.8s ease-in-out infinite; }

.area-title { display: flex; align-items: center; gap: 12px; padding: 4px 0 10px; }
.area-title .em { font-size: 30px; line-height: 1; }
.area-title h2 { font-size: clamp(22px, 5.5vw, 28px); }

.cats { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 1000px) {
  .cats .label { font-size: clamp(15px, calc(var(--dot) * .95), 18px); }
  .cats .desc { font-size: clamp(12.5px, calc(var(--dot) * .8), 15px); }
  .cats .answer { font-size: clamp(13px, calc(var(--dot) * .82), 15.5px); }
}
@media (min-width: 720px) {
  .cats { grid-template-columns: 1fr 1fr; gap: 14px 16px; margin-bottom: 18px; }
  /* 4 righe di carte che occupano l'altezza disponibile: i pallini (e quindi le carte) si ingrandiscono */
  .cats .cat { --dot: clamp(14px, calc((100dvh - 276px) / 32.2), min(22px, 100vw / 46)); --gap: calc(var(--dot) * .36); --pad: calc(var(--dot) * .85); --rb: clamp(44px, calc(var(--dot) * 2.5), 52px); }
  .cats .body { padding-left: 16px; column-gap: 12px; }
  .cats .rbtn { font-size: 28px; }
  .area-title { padding: 8px 0 14px; }
}
/* Altezza della carta = altezza della colonna verticale di 5 pallini (uguale per ogni voce) */
.cat { --dot: 14px; --gap: 5px; --pad: 11px; height: calc(5 * var(--dot) + 4 * var(--gap) + 2 * var(--pad) + 4px); display: grid; grid-template-columns: minmax(0, 1fr) auto; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); box-shadow: 0 2px 0 var(--line); overflow: hidden; transition: border-color .2s, background .2s; min-width: 0; }
.cat.has { border-color: var(--me); }
.cat.bump { animation: bump .3s; }
.body { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; align-items: start; padding: var(--pad) 6px var(--pad) 12px; height: 100%; min-width: 0; }
/* titolo e sottotitolo in alto; scala e valore dinamico ancorati in basso */
.txt { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; height: 100%; overflow: hidden; }
.head { display: grid; gap: 4px; min-width: 0; }
.label { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 15px; line-height: 1.25; min-width: 0; }
.label > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.desc { font-style: italic; font-size: 12.5px; line-height: 1.3; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* la risposta sta sempre in fondo, in corsivo */
.answer { font-style: italic; font-size: 13px; line-height: 1.3; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cat.has .answer { color: var(--me); }
.slots { display: grid; grid-template-columns: var(--dot); grid-template-rows: repeat(5, var(--dot)); gap: var(--gap); }
.slots i { width: var(--dot); height: var(--dot); border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-2); transition: background .15s, box-shadow .15s; }
.slots i.on { background: var(--me); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 1px 1px rgba(0,0,0,.18); }
.slots i.pop { animation: pop .25s ease; }
.ctl { width: calc(var(--rb, 44px) + 8px); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: var(--pad) 0; border-left: 2px solid var(--line); }
.rbtn { width: var(--rb, 44px); height: var(--rb, 44px); flex: none; border-radius: 50%; display: grid; place-items: center; padding: 0 0 2px; font-size: 26px; line-height: 1; font-weight: 500; background: var(--surface); color: var(--ink); border: 2px solid var(--line-2); box-shadow: 0 2px 0 var(--line-2); transition: transform .1s, box-shadow .1s, opacity .2s, background .2s; }
.rbtn.plus { background: var(--me); border-color: var(--me); color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.28); }
.rbtn:hover:not(:disabled) { transform: translateY(-1px); }
.rbtn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.rbtn:disabled { opacity: .3; cursor: default; box-shadow: none; }

.screen[data-area] { padding-bottom: 0; }
.bar { position: sticky; bottom: 0; z-index: 5; margin: auto -16px 0; padding-top: 18px; padding-inline: 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 14px); display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* ---------- results ---------- */

.res-head { display: grid; gap: 12px; padding-block: 4px 14px; }
.res-sub { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.exp { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 16px; border-radius: 99px; border: 2px solid var(--line-2); background: var(--surface); font-size: 14px; font-weight: 600; }
.exp:hover { border-color: var(--ink-2); }
.exp svg, .exp-end svg { width: 16px; height: 16px; }
.exp-end { padding-top: 26px; padding-bottom: 0; }
.exp-end .btn { display: inline-flex; align-items: center; gap: 9px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; }
.legend > span { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.muted { margin: 0; font-size: 13px; color: var(--ink-2); }

/* panoramica: sei riquadri, barra = quante voci per esito */
.ov { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
@media (min-width: 720px) { .ov { grid-template-columns: repeat(6, 1fr); } }
.ov-t { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 6px 12px 8px; display: grid; gap: 6px; text-align: left; min-width: 0; min-height: 44px; }
.ov-t:hover { border-color: var(--line-2); }
.ov-t .e, .map-area .em { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; line-height: 1; }
.ov-t .e { font-size: 22px; }
.ov-t b { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* sintesi a etichette */
.sum { display: grid; gap: 10px; margin-top: 12px; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.sum-row { display: grid; grid-template-columns: 124px 1fr; gap: 10px; align-items: start; }
@media (max-width: 440px) { .sum-row { grid-template-columns: 1fr; gap: 6px; } }
.sum-l { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; min-height: 36px; }
.sum-l i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.sum-l.ok i { background: var(--ok); } .sum-l.mid i { background: var(--mid); } .sum-l.talk i { background: var(--talk); }
.sum-c { display: flex; flex-wrap: wrap; gap: 6px; }
.go { border: 0; border-radius: 99px; padding: 0 13px; min-height: 40px; font-size: 13px; font-weight: 600; }
.go.ok { background: var(--ok-soft); color: #3d6a47; } .go.mid { background: var(--mid-soft); color: #7d5a0c; } .go.talk { background: var(--talk-soft); color: #9a3720; }
.go:active { transform: translateY(1px); }

/* mappa: una riga per voce */
.map { display: grid; gap: 12px; margin-top: 14px; }
@media (min-width: 720px) { .map { grid-template-columns: 1fr 1fr; align-items: start; } }
.map-area { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 10px 10px 6px; scroll-margin-top: 12px; }
.map-area > header { display: flex; align-items: center; gap: 10px; padding: 2px 4px 8px; }
.map-area .em { font-size: 22px; }
.map-area h3 { font-size: 17px; margin-right: auto; }
.rw { border-top: 1.5px solid var(--line); border-radius: 0; }
.rw summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 4px; cursor: pointer; }
.rw summary::-webkit-details-marker { display: none; }
.rw-t { flex: 0 0 40%; font-size: 13px; font-weight: 600; line-height: 1.2; min-width: 0; }
.rw-track { position: relative; flex: 1; height: 24px; min-width: 0; }
.rw-track::before { content: ""; position: absolute; left: 7px; right: 7px; top: 50%; height: 2px; margin-top: -1px; border-radius: 1px; background: var(--line); }
.rw-track::after { content: ""; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 1.5px; background: var(--line-2); }
.rw-bar { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--line-2); }
.rw.ok .rw-bar { background: var(--ok); } .rw.mid .rw-bar { background: var(--mid); } .rw.talk .rw-bar { background: var(--talk); }
.pt { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px rgba(0,0,0,.14); z-index: 1; }
.pt.p1 { background: var(--p1); } .pt.p2 { background: var(--p2); }
.rw.eq .pt.p1 { margin-left: -11px; } .rw.eq .pt.p2 { margin-left: -3px; }
.rw.none summary { opacity: .5; }
.rw .pt { animation: ptIn .8s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--n) * 35ms); }
.rw .rw-bar { animation: barIn .8s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--n) * 35ms); }
@keyframes ptIn { from { left: 7px; } }
@keyframes barIn { from { left: 7px; width: 0; } }
.rw[open] { background: color-mix(in srgb, var(--bg) 50%, var(--surface)); border-radius: 12px; }
.rw.flash { animation: flash 1.4s ease; }
@keyframes flash { 0%, 55% { background: var(--mid-soft); } }
.rw-d { padding: 2px 10px 10px; display: grid; gap: 6px; font-size: 13px; }
.rw-d p { margin: 0; }
.qq { font-style: italic; color: var(--ink-2); }
.ln { display: flex; gap: 8px; align-items: flex-start; }
.ln .dot { margin-top: 4px; flex: none; }
.out { font-weight: 600; }
.out.ok { color: #3d6a47; } .out.mid { color: #7d5a0c; } .out.talk { color: #9a3720; } .out.none { color: var(--ink-2); }
.flag { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 800; font-style: normal; margin-left: 6px; vertical-align: 1px; }
.flag.p1 { background: var(--p1); } .flag.p2 { background: var(--p2); }
.warn { display: flex; gap: 8px; align-items: flex-start; }
.warn .flag { margin: 1px 0 0; flex: none; }

/* segnali: una riga ciascuno */
.sec-t { font-size: clamp(20px, 4.5vw, 24px); margin-top: 30px; }
.vc { display: grid; gap: 10px; margin-top: 10px; }
@media (min-width: 720px) { .vc { grid-template-columns: 1fr 1fr; align-items: start; } }
.vc-p { background: var(--surface); border: 2px solid var(--line); border-left-width: 5px; border-radius: 16px; padding: 12px 14px; display: grid; gap: 10px; }
.vc-p.good { border-left-color: var(--ok); }
.vc-p.bad { border-left-color: var(--talk); }
.vc-h { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.vc-s { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.vc-p.good .vc-s { color: #3d6a47; }
.vc-p.bad .vc-s { color: #9a3720; }
.vc-i { display: grid; gap: 4px; padding-top: 10px; border-top: 1.5px solid var(--line); font-size: 13px; }
.vc-i > b { font-size: 14px; }
.vc-i p { margin: 0; }
.vc-i .why { color: var(--ink-2); }

/* giudizio di sezione */
.ov-t .pc { font-size: 13px; font-weight: 700; }
.pc.ok, .vd.ok { color: #3d6a47; } .pc.mid, .vd.mid { color: #7d5a0c; } .pc.talk, .vd.talk { color: #9a3720; }
.vd { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }

/* analisi conclusiva */
.qd { margin-top: 10px; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 14px; }
.qd-h { display: flex; gap: 16px; align-items: center; }
.qd-score { flex: none; width: 92px; height: 92px; border-radius: 50%; display: grid; place-content: center; text-align: center;
  background: conic-gradient(var(--c) calc(var(--s) * 1%), var(--line) 0); position: relative; }
.qd-score::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--surface); }
.qd-score b, .qd-score span { position: relative; }
.qd-score b { font-family: var(--display); font-size: 26px; line-height: 1; }
.qd-score span { font-size: 11px; font-weight: 600; color: var(--ink-2); }

.qd-t p { margin: 0; font-size: 14px; color: var(--ink-2); }
.qd-l { margin: 0; display: grid; gap: 0; }

/* =====================================================================
   STATO — unico oggetto, solo in memoria (nessun localStorage, nessuna rete).
   I dati dei due giocatori sono separati e la UI di un turno legge SOLO
   i dati del giocatore di turno.
   phase: setup | player1 | handoff | player2 | ready | results
   step (dentro player1/player2): intro | round
   ===================================================================== */
function freshState() {
  return {
    phase: "setup",
    tid: 0,                    // identifica la transizione di 2s in corso (si annulla con il reset)
    step: "intro",
    currentRound: 0,
    draft: null,               // pallini della sola area in corso (non ancora confermata)
    players: {
      player1: { name: "", rounds: {} },   // rounds[areaId] = [n, n, ...] (congelato alla conferma)
      player2: { name: "", rounds: {} }
    }
  };
}
let state = freshState();

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const nameOf = k => (state.players[k].name || "").trim() || S().names[k];
const turnKey = () => state.phase === "player1" ? "player1" : state.phase === "player2" ? "player2" : null;
const levelText = (item, n) => tx(item.l[Math.max(0, Math.min(MAX_PER_ITEM, n))]);

/* =====================================================================
   RENDER
   ===================================================================== */
function render() {
  const who = turnKey();
  document.documentElement.lang = LANG;
  $app.dataset.who = who === "player1" ? "p1" : who === "player2" ? "p2" : "";
  let body;
  switch (state.phase) {
    case "setup":   body = viewSetup(); break;
    case "player1":
    case "player2": body = state.step === "intro" ? viewTransition(who) : viewRound(who); break;
    case "handoff": body = viewHandoff(); break;
    case "ready":   body = viewReady(); break;
    case "results": body = viewResults(); break;
  }
  $app.innerHTML = `<div class="wrap">${header(who)}<main id="main" tabindex="-1">${body}</main></div>`;
  if (state.phase === "player1" || state.phase === "player2") {
    if (state.step === "round") updateRound(); else scheduleTransition();
  }
  window.scrollTo(0, 0);
  const m = document.getElementById("main");
  if (m && state.phase !== "setup") m.focus({ preventScroll: true });
}

function pipsHtml() {
  return AREAS.map((a, i) =>
    `<span class="pip ${i < state.currentRound ? "done" : i === state.currentRound ? "now" : ""}">${a.emoji}</span>`).join("");

/* =====================================================================
   RISULTATI (l'unica schermata che legge i dati di entrambi)
   ===================================================================== */
const KIND_CLS = { pillar: "ok", sync: "ok", quiet: "none", nuance: "mid", negotiate: "mid", knot: "talk" };

/* Quando una voce è ok e quando no. a, b = pallini (0–5) dei due giocatori sulla stessa voce.
   - poco in gioco : nessuno dei due supera T.quiet
   - in sintonia   : distanza ≤ T.aligned (pilastro condiviso se entrambi ≥ T.pillar)
   - sfumatura     : distanza ≤ T.nuance   → ciascuno si sposta di un pallino per incontrarsi
   - da negoziare  : distanza ≤ T.negotiate
   - da discutere  : distanza maggiore, posizioni agli estremi della scala */
function classify(a, b) {
  const diff = Math.abs(a - b), hi = Math.max(a, b), lo = Math.min(a, b);
  if (hi <= T.quiet) return "quiet";
  if (diff <= T.aligned) return lo >= T.pillar ? "pillar" : "sync";
  if (diff <= T.nuance) return "nuance";
  if (diff <= T.negotiate) return "negotiate";
  return "knot";
}

function analyse() {
  const r1 = state.players.player1.rounds, r2 = state.players.player2.rounds;
  const areas = AREAS.map(area => {
    const cats = area.items.map((item, i) => {
      const a = r1[area.id][i], b = r2[area.id][i];
      return { item, area, i, a, b, lo: Math.min(a, b), hi: Math.max(a, b), diff: Math.abs(a - b),
               avg: (a + b) / 2, total: a + b, kind: classify(a, b) };
    });
    return { ...area, cats: [...cats].sort((x, y) => y.total - x.total || x.i - y.i), intesa: intesa(cats),
             ta: sum(cats.map(c => c.a)), tb: sum(cats.map(c => c.b)), verdict: areaVerdict(cats) };
  });
  const all = areas.flatMap(a => a.cats);
  const get = (id, i) => all.find(c => c.area.id === id && c.i === i);

  const aligned = all.filter(c => (c.kind === "pillar" || c.kind === "sync") && c.lo >= 1)
    .sort((x, y) => (y.kind === "pillar") - (x.kind === "pillar") || y.lo - x.lo || y.hi - x.hi).slice(0, 3);
  const discuss = all.filter(c => c.kind === "knot" || c.kind === "negotiate")
    .sort((x, y) => (y.kind === "knot") - (x.kind === "knot") || y.item.crit - x.item.crit || y.diff - x.diff || y.hi - x.hi).slice(0, 3);
  const different = all.filter(c => ["nuance", "negotiate", "knot"].includes(c.kind) && !discuss.includes(c))
    .sort((x, y) => y.diff - x.diff || y.hi - x.hi).slice(0, 3);
  return { areas, all, get, aligned, discuss, different, validity: validityCheck(get), intesa: intesa(all) };
}

/* Intesa (0–100%): quanto sono vicine le risposte, pesando di più le voci che contano per almeno
   uno dei due (pallini alti) e i temi di fondo (crit). Le voci poco in gioco pesano poco. */
function intesa(cats) {
  let num = 0, den = 0;
  for (const c of cats) {
    const w = (c.item.crit ? 1.5 : 1) * (0.4 + c.hi / MAX_PER_ITEM);
    num += w * (1 - c.diff / MAX_PER_ITEM); den += w;
  }
  return den ? Math.round(100 * num / den) : 100;
}
/* Giudizio complessivo di una sezione: la chiave (sync | some | knot | talk) e il colore */
function areaVerdict(cats) {
  const knots = cats.filter(c => c.kind === "knot"), neg = cats.filter(c => c.kind === "negotiate").length;
  const score = intesa(cats);
  if (knots.length >= 2 || knots.some(c => c.item.crit) || score < 60) return { cls: "talk", key: "talk" };
  if (!knots.length && !neg && score >= 80) return { cls: "ok", key: "sync" };
  if (knots.length === 1) return { cls: "mid", key: "knot" };
  return { cls: "mid", key: "some" };
}

function validityCheck(get) {
  const out = { a: [], b: [] };
  for (const who of ["a", "b"]) {
    const v = (id, i) => get(id, i)[who];
    for (const r of CONFLICTS) {
      if (!r.when(v)) continue;
      const refs = (typeof r.refs === "function" ? r.refs(v) : r.refs).map(([id, i]) => get(id, i));
      const cross = new Set(refs.map(c => c.area.id)).size > 1;   // incongruenza tra sezioni diverse
      out[who].push({ title: tx(r.title), why: tx(r.why), refs, who, cross });
    }
  }
  return out;
}

const mid = c => `«${esc(levelText(c.item, Math.round(c.avg)))}»`;
/* esito di una voce in una frase (HTML), per la mappa e per il PDF */
function outcomeOf(c) {
  const s = S(), loName = esc(nameOf(c.a >= c.b ? "player2" : "player1"));
  if (c.kind === "quiet") return s.outQuiet;
  if (c.kind === "pillar") return s.outPillar;
  if (c.kind === "sync") return s.outSync;
  if (c.kind === "nuance") return s.outNuance(mid(c));
  if (c.kind === "negotiate") return c.lo <= 1 ? s.outEasy(loName) : s.outHalf(mid(c));
  return s.outKnot(c.item.crit, mid(c));
}
/* per il PDF: su cosa poggiare le fondamenta (pilastri e scelte vicine) e dove lavorare (nodi e compromessi) */
function coachData(A) {
  const foundations = A.all.filter(c => c.kind === "pillar" || (c.kind === "sync" && c.lo >= 2))
    .sort((x, y) => (y.kind === "pillar") - (x.kind === "pillar") || y.item.crit - x.item.crit || y.lo - x.lo || y.hi - x.hi).slice(0, 4);
  const work = A.all.filter(c => c.kind === "knot" || c.kind === "negotiate" || (c.kind === "nuance" && c.item.crit))
    .sort((x, y) => (y.kind === "knot") - (x.kind === "knot") || y.item.crit - x.item.crit || y.diff - x.diff || y.hi - x.hi).slice(0, 4);
  return { foundations, work };
}
/* commento di una sezione (HTML): punto di forza, nodo, per chi pesa di più */
function areaNote(a, n1, n2) {
  const s = S(), parts = [], critFirst = (x, y) => y.item.crit - x.item.crit || y.diff - x.diff;
  const pillar = a.cats.filter(c => c.kind === "pillar").sort((x, y) => y.lo - x.lo)[0]
    || a.cats.filter(c => c.kind === "sync" && c.lo >= 2).sort((x, y) => y.lo - x.lo)[0];
  const knot = a.cats.filter(c => c.kind === "knot").sort(critFirst)[0];
  const neg = a.cats.filter(c => c.kind === "negotiate").sort(critFirst)[0];
  if (pillar) parts.push(`<b>${s.strength}</b> ${esc(tx(pillar.item.t))}`);
  if (knot) parts.push(`<b>${s.knot}</b> ${esc(tx(knot.item.t))}`);
  else if (neg) parts.push(`<b>${s.negotiate}</b> ${esc(tx(neg.item.t))}`);
  if (Math.abs(a.ta - a.tb) >= 6) parts.push(s.weighs(a.ta > a.tb ? n1 : n2));
  if (!parts.length) parts.push(a.cats.every(c => c.kind === "quiet") ? s.quiet : s.nothing);
  return parts.join(" · ");
}

function viewResults() {
  const s = S(), n1 = esc(nameOf("player1")), n2 = esc(nameOf("player2"));
  const A = analyse(), { areas, aligned, discuss, different, validity } = A;
  const key = c => `${c.area.id}-${c.i}`;
  const P = w => (w === "a" ? "p1" : "p2"), NM = w => (w === "a" ? n1 : n2);
  const phrase = (c, v) => esc(levelText(c.item, v));
  const outcome = outcomeOf;

  /* voci coinvolte in un'incongruenza grave: segnate con un "!" nel colore della persona */
  const flags = {};
  for (const w of ["a", "b"]) for (const f of validity[w]) for (const c of f.refs) (flags[key(c)] = flags[key(c)] || []).push({ w, f });

  /* una voce = una riga: due pallini su una scala 0–5, colorata dall'esito; i dettagli si aprono al tocco */
  const pos = v => `calc(7px + (100% - 14px) * ${v / MAX_PER_ITEM})`;
  const row = (c, n) => {
    const cls = KIND_CLS[c.kind], fl = flags[key(c)] || [];
    return `<details class="rw ${cls}${c.a === c.b ? " eq" : ""}" id="rw-${key(c)}" data-a="${c.a}" data-b="${c.b}" style="--n:${n}">
      <summary><span class="rw-t">${esc(tx(c.item.t))}${fl.map(x => `<i class="flag ${P(x.w)}">!</i>`).join("")}</span>
        <span class="rw-track" aria-hidden="true"><i class="rw-bar" style="left:${pos(c.lo)};width:calc((100% - 14px) * ${c.diff / MAX_PER_ITEM})"></i>
          <i class="pt p1" style="left:${pos(c.a)}"></i><i class="pt p2" style="left:${pos(c.b)}"></i></span>
        <span class="sr">${n1}: ${s.of(c.a, MAX_PER_ITEM)}. ${n2}: ${s.of(c.b, MAX_PER_ITEM)}.</span></summary>
      <div class="rw-d">
        <p class="qq">${esc(tx(c.item.d))}</p>
        <p class="ln"><i class="dot p1"></i><span><b>${n1}</b> · ${c.a}: «${phrase(c, c.a)}»</span></p>
        <p class="ln"><i class="dot p2"></i><span><b>${n2}</b> · ${c.b}: «${phrase(c, c.b)}»</span></p>
        <p class="out ${cls}">${outcome(c)}</p>
        ${fl.map(x => `<p class="warn"><i class="flag ${P(x.w)}">!</i><span><b>${NM(x.w)}</b>: ${esc(x.f.title)}</span></p>`).join("")}
      </div></details>`;
  };
  const byOrder = area => [...area.cats].sort((x, y) => x.i - y.i);

  const tiles = areas.map(a => `<button class="ov-t" data-action="goto-area" data-k="${a.id}">
    <span class="e" aria-hidden="true">${a.emoji}</span><b>${esc(tx(a.name))}</b><span class="pc ${a.verdict.cls}">${a.intesa}%</span></button>`).join("");

  /* giudizio complessivo di ogni sezione: esito, intesa e una riga di commento */
  const areaHead = a => `<header><span class="em" aria-hidden="true">${a.emoji}</span><h3>${esc(tx(a.name))}</h3>
      <span class="vd ${a.verdict.cls}">${s.verdict[a.verdict.key]}</span><span class="vp">${a.intesa}%</span></header>
      <p class="an">${areaNote(a, n1, n2)}</p>`;

  const go = (arr, cls) => arr.map(c => `<button class="go ${cls}" data-action="goto" data-k="${key(c)}">${esc(tx(c.item.t))}</button>`).join("");
  const sumRow = (cls, label, arr) => arr.length
    ? `<div class="sum-row"><span class="sum-l ${cls}"><i></i>${label}</span><div class="sum-c">${go(arr, cls)}</div></div>` : "";
  const summary = [sumRow("ok", s.aligned, aligned), sumRow("mid", s.different, different), sumRow("talk", s.discuss, discuss)].join("")
    || `<p class="muted">${s.allClose}</p>`;

  /* validity check: una scheda per giocatore */
  const vcCard = w => {
    const list = validity[w];
    return `<div class="vc-p ${list.length ? "bad" : "good"}">
      <div class="vc-h"><i class="dot ${P(w)}"></i><b>${NM(w)}</b>
        <span class="vc-s">${list.length ? s.toReview(list.length) : s.clean}</span></div>
      ${list.map(f => `<div class="vc-i"><span class="vc-x${f.cross ? " cross" : ""}">${f.cross
          ? `${s.cross} · ${[...new Set(f.refs.map(c => c.area.emoji))].join(" ↔ ")}` : `${s.same} · ${f.refs[0].area.emoji}`}</span><b>${esc(f.title)}</b>
        ${f.refs.map(c => `<p class="ln"><i class="dot ${P(w)}"></i><span>${esc(tx(c.item.t))}: «${phrase(c, c[w])}»</span></p>`).join("")}
        <p class="why">${esc(f.why)}</p></div>`).join("")}
    </div>`;
  };

  return `<section class="screen dash">
    <div class="res-head">
      <h1>${s.mapTitle}</h1>
      <div class="res-sub"><div class="legend"><span><i class="dot p1"></i>${n1}</span><span><i class="dot p2"></i>${n2}</span></div>
        <button class="exp" data-action="export">${dlIcon}${s.export}</button></div>
    </div>
    <div class="ov">${tiles}</div>
    <div class="sum">${summary}</div>
    <div class="map">${areas.map((a, ai) => `<section class="map-area" id="area-${a.id}">
      ${areaHead(a)}
      <div class="rws">${byOrder(a).map((c, i) => row(c, ai * 2 + i)).join("")}</div></section>`).join("")}</div>

    <h2 class="sec-t">${s.vcTitle}</h2>
    <div class="vc">${vcCard("a")}${vcCard("b")}</div>

    <h2 class="sec-t">${s.quadro}</h2>
    ${viewQuadro(quadroData(A, n1, n2))}
    <div class="center exp-end"><button class="btn" data-action="export">${dlIcon}${s.export}</button></div>
  </section>`;
}
const dlIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8"/><path d="M4.5 7 8 10.5 11.5 7"/><path d="M2.5 13.5h11"/></svg>`;

/* Analisi conclusiva: profilo di coppia, intesa globale e sei osservazioni brevi (HTML con <b>).
   Usata sia dalla dashboard sia dal PDF. */
function quadroData({ areas, all, discuss, different, validity, intesa: score }, n1, n2) {
  const s = S();
  const byInt = [...areas].sort((x, y) => y.intesa - x.intesa);
  const best = byInt[0], worst = byInt[byInt.length - 1];
  const top = [...areas].sort((x, y) => (y.ta + y.tb) - (x.ta + x.tb))[0];
  const totA = sum(areas.map(a => a.ta)), totB = sum(areas.map(a => a.tb));
  const names = cs => listJoin(cs.map(c => `<b>${esc(tx(c.item.t))}</b>`));
  const nm = a => esc(tx(a.name));
  const lines = [];

  lines.push(worst.intesa >= 80 ? s.qAllClose(nm(best), best.intesa) : s.qBestWorst(nm(best), best.intesa, nm(worst), worst.intesa));

  const pillars = all.filter(c => c.kind === "pillar").sort((x, y) => y.lo - x.lo || y.item.crit - x.item.crit).slice(0, 3);
  lines.push(pillars.length ? s.qPillars(pillars.length, names(pillars)) : s.qNoPillars);

  const deep = all.filter(c => c.item.crit && (c.kind === "knot" || c.kind === "negotiate")).sort((x, y) => y.diff - x.diff).slice(0, 3);
  lines.push(deep.length ? s.qDeep(deep.length, names(deep)) : s.qNoDeep);

  const fav = k => [...areas].sort((x, y) => y[k] - x[k])[0];
  const fa = fav("ta"), fb = fav("tb");
  let prio = !totA && !totB ? s.qNoDots : fa.id === fb.id ? s.qBoth(nm(fa)) : s.qEach(n1, nm(fa), n2, nm(fb));
  const hiT = Math.max(totA, totB);
  if (hiT && Math.abs(totA - totB) >= hiT * 0.25) prio += s.qMore(totA > totB ? n1 : n2, hiT, Math.min(totA, totB));
  lines.push(prio);

  const vcTxt = w => { const l = validity[w]; return s.qVc(w === "a" ? n1 : n2, l.length, l.filter(f => f.cross).length); };
  const va = validity.a.length, vb = validity.b.length;
  lines.push(!va && !vb ? s.qClean : s.qVcEnd([va && vcTxt("a"), vb && vcTxt("b")].filter(Boolean).join(s.qVcJoin)));

  const first = discuss[0] || different[0];
  lines.push(first ? s.qFirst(esc(tx(first.item.t)), `${first.area.emoji} ${nm(first.area)}`, mid(first)) : s.qNoFirst);

  const prof = totA + totB ? { emoji: top.emoji, name: s.profile[top.id][0], line: s.profile[top.id][1] } : null;
  return { score, global: s.global(score), prof, lines: lines.map((v, i) => [s.qLabels[i], v]) };
}
function viewQuadro(q) {
  const s = S();
  return `<div class="qd">
    <div class="qd-h">
      <div class="qd-score" style="--s:${q.score};--c:var(${q.score >= 80 ? "--ok" : q.score >= 50 ? "--mid" : "--talk"})"><b>${q.score}%</b><span>${s.match}</span></div>
      <div class="qd-t"><span class="eyebrow">${q.global}</span>
        <h3>${q.prof ? `${q.prof.emoji} ${q.prof.name}` : s.empty}</h3>
        ${q.prof ? `<p>${s.heart(q.prof.line)}</p>` : ""}</div>
    </div>
    <dl class="qd-l">${q.lines.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
  </div>`;
}


/* =====================================================================
   PDF — una pagina A4 con la sintesi per sezione, generata qui senza librerie.
   Font standard Helvetica (codifica WinAnsi: accenti italiani inclusi, niente emoji).
   ===================================================================== */
const HELV = {
  r: [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584],
  b: [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584]
};
const WIN = { "€": 0x80, "‚": 0x82, "„": 0x84, "…": 0x85, "‘": 0x91, "’": 0x92, "“": 0x93, "”": 0x94, "•": 0x95, "–": 0x96, "—": 0x97 };
const PDF_SUB = { "↔": "-", "→": ">", "←": "<", "✓": "", "−": "-", " ": " " };
/* testo pronto per il PDF: niente emoji, solo caratteri WinAnsi */
function pdfText(str) {
  let out = "";
  for (const ch of String(str)) {
    if (PDF_SUB[ch] !== undefined) { out += PDF_SUB[ch]; continue; }
    const c = ch.codePointAt(0);
    if (c >= 32 && c <= 255 && !(c > 126 && c < 160)) out += ch;
    else if (WIN[ch]) out += ch;
  }
  return out.replace(/\s+/g, " ").replace(/\(\s+/g, "(").trim();
}
function charW(ch, bold) {
  const c = ch.charCodeAt(0), t = bold ? HELV.b : HELV.r;
  if (c >= 32 && c <= 126) return t[c - 32];
  if ("–«»€".includes(ch)) return 556;
  if ("—…".includes(ch)) return 1000;
  if ("’‘·".includes(ch)) return 278;
  const base = ch.normalize("NFD")[0];
  const b = base.charCodeAt(0);
  return b >= 32 && b <= 126 ? t[b - 32] : 556;
}
const textW = (s, size, bold) => [...s].reduce((w, ch) => w + charW(ch, bold), 0) * size / 1000;
const pdfStr = s => "(" + [...s].map(ch => {
  if (ch === "\\" || ch === "(" || ch === ")") return "\\" + ch;
  const code = WIN[ch] || ch.charCodeAt(0);
  return String.fromCharCode(code);
}).join("") + ")";
const unhtml = h => h.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
/* "testo <b>grassetto</b>" → parole con il loro stile */
function richWords(html) {
  const words = []; let bold = false, gap = false;   // gap: c'era uno spazio prima della prossima parola
  for (const part of html.split(/(<b>|<\/b>)/)) {
    if (part === "<b>") { bold = true; continue; }
    if (part === "</b>") { bold = false; continue; }
    const raw = unhtml(part.replace(/<[^>]+>/g, "")), t = pdfText(raw);
    if (!t) { gap = gap || /\s/.test(raw); continue; }
    t.split(" ").forEach((w, k) => words.push({ w, bold, sp: k > 0 || gap || /^\s/.test(raw) }));
    gap = /\s$/.test(raw);
  }
  return words;
}
function wrapRich(html, width, size) {
  const lines = [[]]; let x = 0;
  for (const wd of richWords(html)) {
    const sp = wd.sp && lines[lines.length - 1].length ? textW(" ", size, false) : 0;
    const w = textW(wd.w, size, wd.bold);
    if (x + sp + w > width && lines[lines.length - 1].length) { lines.push([]); x = 0; lines[lines.length - 1].push({ ...wd, x: 0 }); x = w; }
    else { lines[lines.length - 1].push({ ...wd, x: x + sp }); x += sp + w; }
  }
  return lines;
}
function ellipsize(s, width, size, bold) {
  s = pdfText(s);
  if (textW(s, size, bold) <= width) return s;
  while (s.length > 1 && textW(s + "…", size, bold) > width) s = s.slice(0, -1);
  return s.trimEnd() + "…";
}

function buildPdf() {
  const s = S(), W = 595.28, H = 841.89, M = 36;
  const n1 = esc(nameOf("player1")), n2 = esc(nameOf("player2"));
  const A = analyse(), q = quadroData(A, n1, n2);
  const css = getComputedStyle(document.documentElement);
  const hex = v => { const h = (css.getPropertyValue(v).trim() || "#000000").replace("#", ""); return [0, 2, 4].map(i => (parseInt(h.slice(i, i + 2), 16) / 255).toFixed(3)).join(" "); };
  const C = { ink: hex("--ink"), ink2: hex("--ink-2"), line: hex("--line"), line2: hex("--line-2"), surface: hex("--surface"), bg: hex("--bg"),
    p1: hex("--p1"), p2: hex("--p2"), ok: hex("--ok"), mid: hex("--mid"), talk: hex("--talk"),
    okT: "0.239 0.416 0.278", midT: "0.490 0.353 0.047", talkT: "0.604 0.216 0.125", okS: hex("--ok-soft"), midS: hex("--mid-soft"), talkS: hex("--talk-soft") };
  const o = [];
  const Y = y => (H - y).toFixed(2);
  const text = (str, x, y, size, { bold = false, color = C.ink } = {}) => {
    const t = pdfText(str); if (!t) return;
    o.push(`BT ${color} rg /${bold ? "F2" : "F1"} ${size} Tf ${x.toFixed(2)} ${Y(y)} Td ${pdfStr(t)} Tj ET`);
  };
  const textR = (str, xr, y, size, opt = {}) => text(str, xr - textW(pdfText(str), size, opt.bold), y, size, opt);
  const rich = (lines, x, y, size, lh, color = C.ink) => lines.forEach((ln, k) =>
    ln.forEach(wd => text(wd.w, x + wd.x, y + k * lh, size, { bold: wd.bold, color })));
  const rrect = (x, y, w, h, r, fill, stroke) => {
    const k = 0.5523 * r, x2 = x + w, y2 = y + h;
    o.push(`${fill ? fill + " rg " : ""}${stroke ? stroke + " RG 0.8 w " : ""}${(x + r).toFixed(2)} ${Y(y)} m ${(x2 - r).toFixed(2)} ${Y(y)} l ` +
      `${(x2 - r + k).toFixed(2)} ${Y(y)} ${x2.toFixed(2)} ${Y(y + r - k)} ${x2.toFixed(2)} ${Y(y + r)} c ${x2.toFixed(2)} ${Y(y2 - r)} l ` +
      `${x2.toFixed(2)} ${Y(y2 - r + k)} ${(x2 - r + k).toFixed(2)} ${Y(y2)} ${(x2 - r).toFixed(2)} ${Y(y2)} c ${(x + r).toFixed(2)} ${Y(y2)} l ` +
      `${(x + r - k).toFixed(2)} ${Y(y2)} ${x.toFixed(2)} ${Y(y2 - r + k)} ${x.toFixed(2)} ${Y(y2 - r)} c ${x.toFixed(2)} ${Y(y + r)} l ` +
      `${x.toFixed(2)} ${Y(y + r - k)} ${(x + r - k).toFixed(2)} ${Y(y)} ${(x + r).toFixed(2)} ${Y(y)} c ${fill && stroke ? "B" : fill ? "f" : "S"}`);
  };
  const circle = (cx, cy, r, fill, stroke) => {
    const k = 0.5523 * r, X = v => v.toFixed(2);
    o.push(`${fill} rg ${stroke ? stroke + " RG 0.9 w " : ""}${X(cx + r)} ${Y(cy)} m ${X(cx + r)} ${Y(cy - k)} ${X(cx + k)} ${Y(cy - r)} ${X(cx)} ${Y(cy - r)} c ` +
      `${X(cx - k)} ${Y(cy - r)} ${X(cx - r)} ${Y(cy - k)} ${X(cx - r)} ${Y(cy)} c ${X(cx - r)} ${Y(cy + k)} ${X(cx - k)} ${Y(cy + r)} ${X(cx)} ${Y(cy + r)} c ` +
      `${X(cx + k)} ${Y(cy + r)} ${X(cx + r)} ${Y(cy + k)} ${X(cx + r)} ${Y(cy)} c ${stroke ? "B" : "f"}`);
  };
  const line = (x1, y1, x2, y2, color, w) => o.push(`${color} RG ${w} w 1 J ${x1.toFixed(2)} ${Y(y1)} m ${x2.toFixed(2)} ${Y(y2)} l S`);
  const tone = cls => ({ ok: [C.ok, C.okT, C.okS], mid: [C.mid, C.midT, C.midS], talk: [C.talk, C.talkT, C.talkS], none: [C.line2, C.ink2, C.line] }[cls]);

  // sfondo
  o.push(`${C.bg} rg 0 0 ${W} ${H} re f`);
  const CW = W - 2 * M;

  // intestazione: logo, titolo, nomi, data
  line(M + 5, M + 6, M + 25, M + 6, C.mid, 3.2);
  circle(M + 5, M + 6, 5, C.p1); circle(M + 25, M + 6, 5, C.p2);
  text("Halfway", M + 36, M + 11, 16, { bold: true });
  textR(new Date().toLocaleDateString(LANG === "it" ? "it-IT" : "en-GB", { day: "numeric", month: "long", year: "numeric" }), W - M, M + 10, 8.5, { color: C.ink2 });
  text(s.mapTitle, M, M + 40, 20, { bold: true });
  let lx = M; const ly = M + 56;
  for (const [k, col] of [["player1", C.p1], ["player2", C.p2]]) {
    circle(lx + 4, ly - 3, 3.6, col);
    const nm = pdfText(nameOf(k)); text(nm, lx + 12, ly, 9.5, { bold: true }); lx += 12 + textW(nm, 9.5, true) + 18;
  }
  const heading = (str, x, y, col) => { rrect(x, y - 9, 3.5, 12, 1.7, col); text(str, x + 9, y, 10.5, { bold: true }); };

  // ---- sinistra: ragnatela della compatibilità per sezione
  const top = M + 72, leftW = 262, xr = M + leftW + 16, rightW = CW - leftW - 16;
  heading(s.pdfRadar, M, top + 8, C.mid);
  const n = A.areas.length, R = 86, cx = M + leftW / 2, cy = top + 24 + 24 + R;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
  const poly = (pts, op, fill, stroke, w = 0.6) => o.push(`${fill ? fill + " rg " : ""}${stroke ? stroke + " RG " + w + " w 1 j " : ""}` +
    pts.map(([x, y], i) => `${x.toFixed(2)} ${Y(y)} ${i ? "l" : "m"}`).join(" ") + ` h ${op}`);
  const ring = f => Array.from({ length: n }, (_, i) => pt(i, R * f));
  poly(ring(1), "B", C.surface, C.line2, 0.8);
  for (const f of [0.75, 0.5, 0.25]) poly(ring(f), "S", null, C.line, 0.5);
  for (let i = 0; i < n; i++) { const [x, y] = pt(i, R); line(cx, cy, x, y, C.line, 0.5); }
  for (const f of [0.5, 1]) textR(`${f * 100}`, cx - 2.5, cy - R * f + 6.5, 5.5, { color: C.ink2 });
  const level = q.score >= 80 ? "ok" : q.score >= 50 ? "mid" : "talk";
  const vals = A.areas.map((a, i) => pt(i, R * Math.max(a.intesa, 4) / 100));
  o.push(`q /GS1 gs`); poly(vals, "f", tone(level)[0]); o.push(`Q`);
  poly(vals, "S", null, tone(level)[1], 1.5);
  A.areas.forEach((a, i) => {
    const [x, y] = vals[i]; circle(x, y, 3.3, tone(a.verdict.cls)[0], C.surface);
    const [lx0, ly0] = pt(i, R + 11), c = Math.cos(ang(i)), sn = Math.sin(ang(i));
    const nm = pdfText(tx(a.name)), pc = `${a.intesa}%`, wN = textW(nm, 8.2, true), wP = textW(pc, 8.2, true);
    const lines = [[nm, wN, true, C.ink], [pc, wP, true, tone(a.verdict.cls)[1]]];
    const y0 = sn < -0.5 ? ly0 - 12 : sn > 0.5 ? ly0 + 6 : ly0 - 3;
    lines.forEach(([t, w, b, col], k) => text(t, c > 0.3 ? lx0 : c < -0.3 ? lx0 - w : lx0 - w / 2, y0 + k * 10, 8.2, { bold: b, color: col }));
  });
  rich(wrapRich(q.lines[0][1], leftW, 7.8).slice(0, 3), M, cy + R + 40, 7.8, 10, C.ink2);

  // ---- destra: intesa globale, profilo e giudizio per sezione
  const [scol] = tone(level);
  rrect(xr, top, rightW, 66, 10, C.surface, C.line);
  const sx = xr + 36, sy = top + 33;
  circle(sx, sy, 24, scol); circle(sx, sy, 19, C.surface);
  const sc = `${q.score}%`; text(sc, sx - textW(sc, 14, true) / 2, sy + 3, 14, { bold: true });
  text(s.match, sx - textW(pdfText(s.match), 6.5, false) / 2, sy + 11.5, 6.5, { color: C.ink2 });
  text(q.global.toUpperCase(), xr + 72, top + 19, 7, { bold: true, color: C.ink2 });
  text(q.prof ? q.prof.name : s.empty, xr + 72, top + 35, 13.5, { bold: true });
  if (q.prof) rich(wrapRich(esc(s.heart(q.prof.line)), rightW - 82, 7.6).slice(0, 2), xr + 72, top + 47, 7.6, 9, C.ink2);
  const rowH = 36, r0 = top + 80;
  A.areas.forEach((a, i) => {
    const y = r0 + i * rowH, [col, tcol] = tone(a.verdict.cls);
    if (i) line(xr, y - 5, xr + rightW, y - 5, C.line, 0.5);
    circle(xr + 4, y + 5, 3.4, col);
    text(tx(a.name), xr + 13, y + 8, 8.8, { bold: true });
    text(s.verdict[a.verdict.key], xr + 13, y + 19.5, 7, { bold: true, color: tcol });
    const bx = xr + 112, bw = rightW - 112 - 34;
    rrect(bx, y + 3, bw, 5.5, 2.7, C.line); rrect(bx, y + 3, Math.max(5.5, bw * a.intesa / 100), 5.5, 2.7, col);
    textR(`${a.intesa}%`, xr + rightW, y + 8.4, 8.8, { bold: true });
  });

  // ---- su cosa poggiare le fondamenta / dove lavorare
  const { foundations, work } = coachData(A);
  const colW = (CW - 18) / 2, y2 = Math.max(cy + R + 40 + 3 * 10, r0 + 6 * rowH) + 6;
  const col2 = M + colW + 18;
  heading(s.pdfBuild, M, y2, C.ok); heading(s.pdfWork, col2, y2, C.talk);
  const card = (c, x, y, w, good) => {
    const [, tcol] = tone(good ? "ok" : c.kind === "knot" ? "talk" : "mid");
    text(ellipsize(tx(c.item.t), w - 62, 8.8, true), x, y + 9, 8.8, { bold: true });
    textR(tx(c.area.name), x + w, y + 9, 6.8, { color: C.ink2 });
    [["player1", c.a, C.p1], ["player2", c.b, C.p2]].forEach(([k, v, col], r) => {
      circle(x + 3, y + 17.4 + r * 9.6, 2.6, col);
      text(ellipsize(`${nameOf(k)}: «${levelText(c.item, v)}»`, w - 12, 7.4, false), x + 10, y + 20 + r * 9.6, 7.4);
    });
    let h = 40;
    if (good) { text(c.kind === "pillar" ? s.pdfPillar : s.pdfClose, x + 10, y + 39, 7.4, { bold: true, color: tcol }); h += 9; }
    else { const ls = wrapRich(outcomeOf(c), w - 10, 7.4).slice(0, 2); rich(ls, x + 10, y + 39, 7.4, 9, tcol); h += ls.length * 9; }
    return h + 6;
  };
  const column = (items, x, good, empty) => {
    let y = y2 + 14;
    if (!items.length) { rich(wrapRich(esc(empty), colW, 7.8), x, y + 10, 7.8, 10, C.ink2); return y + 30; }
    items.forEach(c => { line(x, y, x + colW, y, C.line, 0.5); y += 4 + card(c, x, y + 4, colW, good) - 4; });
    return y;
  };
  const yEnd = Math.max(column(foundations, M, true, s.qNoPillars), column(work, col2, false, s.pdfNoWork));

  // ---- da tenere presente
  let y = yEnd + 10;
  heading(s.pdfNotes, M, y, C.mid); y += 8;
  const labW = 84, bodyW = CW - labW, fs = 7.6;
  for (const [label, html] of q.lines.slice(2)) {
    const ls = wrapRich(html, bodyW, fs);
    line(M, y, W - M, y, C.line, 0.6);
    text(label, M, y + 11, fs, { bold: true });
    rich(ls, M + labW, y + 11, fs, 9.6);
    y += 7 + ls.length * 9.6;
  }
  text(s.pdfScale, M, H - M + 14, 7, { color: C.ink2 });
  textR("Halfway", W - M, H - M + 14, 7, { bold: true, color: C.ink2 });

  // assemblaggio del file PDF
  const content = o.join("\n");
  const objs = [
    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> /ExtGState << /GS1 << /ca 0.3 >> >> >> /Contents 4 0 R >>`,
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>",
    `<< /Title ${pdfStr("Halfway - " + pdfText(s.mapTitle))} /Producer (Halfway) >>`
  ];
  let out = "%PDF-1.4\n%âãÏÓ\n";
  const offs = objs.map((body, i) => { const at = out.length; out += `${i + 1} 0 obj\n${body}\nendobj\n`; return at; });
  const xref = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(n => String(n).padStart(10, "0") + " 00000 n \n").join("");
  out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  const bytes = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
  return bytes;
}

/* Salvataggio: nella pagina pubblicata passa dalla conferma di download della piattaforma,
   aperto come file locale usa un normale download del browser. */
async function exportPdf() {
  const s = S();
  let bytes;
  try { bytes = buildPdf(); } catch (e) { toast(s.exportFail); return; }
  const filename = `${s.pdfFile}-${new Date().toISOString().slice(0, 10)}.pdf`;
  const blob = new Blob([bytes], { type: "application/pdf" });
  let dl = null;
  if (window.claude && typeof window.claude.use === "function") { try { dl = await window.claude.use("downloads"); } catch (e) { dl = null; } }
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast(s.saved); }
    catch (e) { if (e && e.code !== "declined") toast(s.exportFail); }
    return;
  }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}


/* =====================================================================
   AZIONI
   ===================================================================== */
function addDot(i) {
  if (!state.draft) return;
  if (state.draft[i] >= MAX_PER_ITEM) { bump(document.querySelector(`.cat[data-i="${i}"]`)); return; }
  state.draft[i]++;
  tick();
  updateRound(i);
}
function subDot(i) {
  if (!state.draft || state.draft[i] <= 0) return;
  state.draft[i]--;
  tick();
  updateRound();
}
function tick() { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} }
function toast(msg) {
  const old = document.getElementById("toast"); if (old) old.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.id = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1900);
}
function bump(el) { if (!el) return; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

function confirmRound() {
  const who = turnKey();
  if (!who || state.step !== "round" || !state.draft) return;
  const area = AREAS[state.currentRound];
  state.players[who].rounds[area.id] = state.draft.slice();
  state.currentRound++;
  if (state.currentRound < AREAS.length) {
    state.draft = draftFor(who, state.currentRound);
  } else {
    state.draft = null;
    state.phase = who === "player1" ? "handoff" : "ready";
    state.step = "intro";
  }
  render();
  if (state.step === "round") toast(`${area.emoji} ${S().done(tx(area.name))}`);
}

/* Indietro: salva quanto fatto nell'area, poi riapre la precedente con i suoi valori (solo del giocatore di turno) */
function goBack() {
  const who = turnKey();
  if (!who || state.step !== "round" || !state.draft || state.currentRound === 0) return;
  state.players[who].rounds[AREAS[state.currentRound].id] = state.draft.slice();
  state.currentRound--;
  state.draft = draftFor(who, state.currentRound);
  render();
}

function openResetDialog() {
  if (document.getElementById("modal")) return;
  const s = S(), el = document.createElement("div");
  el.className = "scrim"; el.id = "modal";
  el.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="mt">
    <p id="mt">${s.confirmReset}</p>
    <div class="row"><button class="btn ghost" data-action="cancel-reset">${s.cancel}</button>
    <button class="btn danger" data-action="do-reset">${s.reset}</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector('[data-action="cancel-reset"]').focus();
}
function closeDialog() { const m = document.getElementById("modal"); if (m) m.remove(); }

/* Reset reale: sostituisce l'intero oggetto di stato, poi ridisegna da zero (la lingua resta). */
function resetAll() {
  state = freshState();
  closeDialog();
  const t = document.getElementById("toast"); if (t) t.remove();
  render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const i = +t.dataset.i;
  switch (t.dataset.action) {
    case "lang": readNames(); LANG = t.dataset.k === "en" ? "en" : "it"; render(); break;
    case "start":
      /* nomi facoltativi: se restano vuoti si usano quelli di default */
      readNames();
      state.phase = "player1"; state.step = "intro"; render(); break;
    case "add": addDot(i); break;
    case "sub": subDot(i); break;
    case "confirm": confirmRound(); break;
    case "back": goBack(); break;
    case "handoff": state.phase = "player2"; state.step = "intro"; state.currentRound = 0; render(); break;
    case "reveal": state.phase = "results"; render(); break;
    case "export": exportPdf(); break;
    case "goto": {
      const el = document.getElementById("rw-" + t.dataset.k);
      if (el) { el.open = true; el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
      break;
    }
    case "goto-area": { const el = document.getElementById("area-" + t.dataset.k); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); break; }
    case "ask-reset": openResetDialog(); break;
    case "cancel-reset": closeDialog(); break;
    case "do-reset": resetAll(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDialog();
  /* Invio nel primo nome passa al secondo, nel secondo fa partire il gioco */
  if (e.key === "Enter" && e.target.id === "name-player1") { e.preventDefault(); document.getElementById("name-player2").focus(); }
  else if (e.key === "Enter" && e.target.id === "name-player2") { e.preventDefault(); document.querySelector('[data-action="start"]').click(); }
});

render();

</script>
</body>
</html>
