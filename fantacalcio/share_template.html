<title>Riccardo's Fantacalcio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one league at a time behind a two-way switch; standings beside a tactics-board pitch of the squad */
:root {
  --bg: #eef1ec; --surface: #ffffff; --ink: #17201a; --muted: #5d6a61; --line: #d9dfd8;
  --accent: #1f6b41; --me: #fff1b8; --me-ink: #6b4e00;
  --pitch: #2e7a49; --pitch-dark: #276b3f; --chalk: rgba(255,255,255,.55); --token: #ffffff; --token-ink: #17201a;
  --role-p: #d98a1f; --role-d: #2f8a4f; --role-c: #2c66c9; --role-a: #cf3e31;
  --win: #1f7a43; --draw: #8a948c; --loss: #c0392b;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111612; --surface: #1a211c; --ink: #e8eee9; --muted: #98a59c; --line: #2b352e;
    --accent: #5cc48a; --me: #3b3413; --me-ink: #f5d76e;
    --pitch: #1f5233; --pitch-dark: #1a472c; --chalk: rgba(255,255,255,.35); --token: #f4f7f4; --token-ink: #17201a;
    --win: #4ccd7f; --draw: #8f9a92; --loss: #ef6b5c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111612; --surface: #1a211c; --ink: #e8eee9; --muted: #98a59c; --line: #2b352e;
  --accent: #5cc48a; --me: #3b3413; --me-ink: #f5d76e;
  --pitch: #1f5233; --pitch-dark: #1a472c; --chalk: rgba(255,255,255,.35); --token: #f4f7f4; --token-ink: #17201a;
  --win: #4ccd7f; --draw: #8f9a92; --loss: #ef6b5c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* league switch */
.switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.switch button { all: unset; cursor: pointer; padding: 12px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 2px; }
.switch button[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch .lg { font: 600 13px var(--body); color: var(--muted); }
.switch .tm { font: 700 22px/1.1 var(--display); }

/* hero */
.hero { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; padding-block: 8px; }
.hero h2 { font-size: clamp(34px, 6vw, 56px); line-height: .95; letter-spacing: -.01em; text-transform: uppercase; }
.hero .sub { color: var(--muted); margin-top: 6px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.fact { display: grid; gap: 2px; }
.fact b { font: 700 40px/1 var(--display); font-variant-numeric: tabular-nums; }
.fact b sup { font-size: 20px; }
.fact span { font-size: 13px; color: var(--muted); }
.form { display: inline-flex; gap: 4px; }
.r { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; font: 700 12px var(--display); color: #fff; }
.r.W { background: var(--win); } .r.D { background: var(--draw); } .r.L { background: var(--loss); }

.cols { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.panel h3 { font-size: 22px; text-transform: uppercase; letter-spacing: .02em; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.panel h3 small { font: 500 13px var(--body); color: var(--muted); text-transform: none; letter-spacing: 0; }

/* standings */
.scroll { overflow-x: auto; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 6px 6px; border-bottom: 1px solid var(--line); }
td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:nth-child(2), td:nth-child(2) { text-align: left; }
td.pos { font: 700 18px var(--display); text-align: center; width: 34px; color: var(--muted); }
tr:first-child td.pos { color: var(--accent); }
td.team { font-weight: 600; white-space: normal; min-width: 130px; }
td.pts { font: 700 20px var(--display); }
td.fp { min-width: 92px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
.bar i { display: block; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.bar i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--accent); border-radius: 3px; }
tr.me td { background: var(--me); color: var(--me-ink); }
tr.me td.pos { color: var(--me-ink); }
tr.me .bar i::after { background: var(--me-ink); }
.key { font-size: 12px; color: var(--muted); margin-top: 10px; }

/* pitch */
.pitch { margin-top: 12px; border-radius: 12px; padding: 14px 10px; position: relative; overflow: hidden;
  background: repeating-linear-gradient(180deg, var(--pitch) 0 56px, var(--pitch-dark) 56px 112px);
  border: 2px solid var(--chalk); display: grid; gap: 6px; }
.pitch::before { content: ""; position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%); border: 2px solid var(--chalk); border-radius: 50%; pointer-events: none; }
.pitch::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid var(--chalk); pointer-events: none; }
.line { position: relative; z-index: 1; display: grid; gap: 8px; padding-block: 8px; }
.line-label { font: 700 13px var(--display); letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.8); text-align: center; }
.players { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.pl { background: var(--token); color: var(--token-ink); border-radius: 10px; padding: 6px 10px 6px 6px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1px 8px; align-items: center; width: 168px; box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.pl .shirt { grid-row: span 2; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 11px/1 var(--display); letter-spacing: .02em; text-align: center; }
.pl .nm { font: 700 15px/1.1 var(--display); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .meta { font-size: 12px; color: #5d6a61; display: flex; gap: 6px; white-space: nowrap; overflow: hidden; min-width: 0; }
.pl .meta > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.pl .fm { grid-row: span 2; grid-column: 3; font: 700 17px var(--display); color: #17201a; font-variant-numeric: tabular-nums; }
.pl.idle { opacity: .72; }
.P { background: var(--role-p); } .D { background: var(--role-d); } .C { background: var(--role-c); } .A { background: var(--role-a); }
@media (max-width: 480px) { .pl { width: calc(50% - 4px); padding-right: 8px; gap: 1px 6px; } .pl .shirt { width: 26px; height: 26px; font-size: 10px; } .pitch { padding-inline: 6px; } .wide { display: none; } td.fp { min-width: 0; } .bar { grid-template-columns: auto; } .bar i { display: none; } }
.squad-facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); margin-top: 10px; }
.squad-facts b { color: var(--ink); font-variant-numeric: tabular-nums; }
footer { font-size: 12px; color: var(--muted); text-align: center; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { section[data-league] { animation: in .25s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } } }
</style>

<div class="wrap">
  <header style="display:grid;gap:12px">
    <div class="eyebrow">Fantacalcio · Riccardo Rao</div>
    <div class="switch" role="tablist" aria-label="League" id="switch"></div>
  </header>
  <main id="leagues"></main>
  <footer id="foot"></footer>
</div>

<script>
const LEAGUES = /*__DATA__*/null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const n = v => v == null ? "–" : Number.isInteger(v) ? v : (+v).toFixed(1).replace(/\.0$/, "");
const LINES = [["A", "Forwards"], ["C", "Midfielders"], ["D", "Defenders"], ["P", "Goalkeepers"]];
const date = s => { const d = new Date(s.replace(" ", "T")); return isNaN(d) ? s : d.toLocaleDateString("en-GB", {day: "numeric", month: "short", year: "numeric"}); };

const sw = document.getElementById("switch"), main = document.getElementById("leagues");
LEAGUES.forEach((L, i) => {
  const me = L.standings.find(s => s.id === L.my_team) || {};
  const maxFp = Math.max(...L.standings.map(s => s.fp || 0)) || 1;
  const b = document.createElement("button");
  b.setAttribute("role", "tab"); b.id = "tab-" + L.alias; b.dataset.alias = L.alias;
  b.innerHTML = `<span class="lg">${esc(L.name)} · ${me.pos ?? "–"}° of ${L.standings.length}</span><span class="tm">${esc(L.squad.team)}</span>`;
  b.onclick = () => show(L.alias, true);
  sw.append(b);

  const ps = L.squad.players;
  const spent = ps.reduce((a, p) => a + (p.paid || 0), 0);
  const scorers = ps.filter(p => p.goals).sort((a, b) => b.goals - a.goals).slice(0, 3);
  const sec = document.createElement("section");
  sec.dataset.league = L.alias; sec.setAttribute("role", "tabpanel"); sec.setAttribute("aria-labelledby", "tab-" + L.alias);
  sec.innerHTML = `
    <div class="hero">
      <div>
        <div class="eyebrow">${[L.name, L.type, L.competition !== L.name ? L.competition : ""].filter(Boolean).map(esc).join(" · ")}</div>
        <h2>${esc(L.squad.team)}</h2>
        <div class="sub">After ${L.rounds_played} round${L.rounds_played === 1 ? "" : "s"} · updated ${esc(date(L.fetched_at))}</div>
      </div>
      <div class="facts">
        <div class="fact"><b>${me.pos ?? "–"}<sup>°</sup></b><span>of ${L.standings.length}</span></div>
        <div class="fact"><b>${n(me.pts)}</b><span>points</span></div>
        <div class="fact"><b>${n(me.fp)}</b><span>fantasy points</span></div>
        ${me.form ? `<div class="fact"><span class="form" style="height:40px;align-items:center">${[...me.form].map(r => `<i class="r ${r}" title="${r === "W" ? "Won" : r === "L" ? "Lost" : "Drawn"}">${r}</i>`).join("")}</span><span>form</span></div>` : ""}
      </div>
    </div>
    <div class="cols">
      <div class="panel">
        <h3>Standings <small>${esc(L.competition)}</small></h3>
        <div class="scroll"><table>
          <thead><tr><th style="text-align:center">#</th><th>Team</th><th title="Played">P</th><th class="wide" title="Won">W</th><th class="wide" title="Drawn">D</th><th class="wide" title="Lost">L</th><th class="wide" title="Goals for–against">Goals</th><th title="Points">Pts</th><th title="Fantasy points">FP</th></tr></thead>
          <tbody>${L.standings.map(s => `<tr class="${s.id === L.my_team ? "me" : ""}">
            <td class="pos">${s.pos}</td><td class="team">${esc(s.team)}</td><td>${n(s.played)}</td><td class="wide">${n(s.w)}</td><td class="wide">${n(s.d)}</td><td class="wide">${n(s.l)}</td>
            <td class="wide">${n(s.gf)}–${n(s.ga)}</td><td class="pts">${n(s.pts)}</td>
            <td class="fp"><span class="bar"><i style="--w:${(100 * (s.fp || 0) / maxFp).toFixed(1)}%"></i>${n(s.fp)}</span></td></tr>`).join("")}</tbody>
        </table></div>
        <div class="key">Pts: league points (3 for a win, 1 for a draw). FP: fantasy points scored in total, the usual tie-breaker.</div>
      </div>
      <div class="panel">
        <h3>Squad <small>${ps.length} players · ${spent} credits spent · ${n(L.squad.credits_left)} left</small></h3>
        <div class="pitch">${LINES.map(([k, label]) => {
          const line = ps.filter(p => p.line === k).sort((a, b) => (b.paid || 0) - (a.paid || 0));
          return line.length ? `<div class="line"><div class="line-label">${label} · ${line.length}</div><div class="players">${line.map(p => `
            <div class="pl ${p.apps ? "" : "idle"}" title="${esc(p.name)} (${esc(p.club)}): ${p.apps || 0} appearances, ${p.goals || 0} goals, ${p.assists || 0} assists, bought for ${n(p.paid)} credits">
              <span class="shirt ${p.line}">${esc(p.role.split(";")[0])}</span>
              <span class="nm">${esc(p.name)}</span>
              <span class="fm" title="Fanta-average">${p.fanta != null ? n(p.fanta) : "–"}</span>
              <span class="meta"><span>${esc(p.club)}</span><span class="num">${n(p.paid)} cr</span></span>
            </div>`).join("")}</div></div>` : "";
        }).join("")}</div>
        <div class="squad-facts">
          <span>Big number on each card: fanta-average this season (vote with bonus and malus). Faded cards: no appearances yet.</span>
          ${scorers.length ? `<span>Top scorers: ${scorers.map(p => `<b>${esc(p.name)} ${p.goals}</b>`).join(", ")}</span>` : ""}
        </div>
      </div>
    </div>`;
  main.append(sec);
});

function show(alias, push) {
  for (const b of sw.children) b.setAttribute("aria-selected", String(b.dataset.alias === alias));
  for (const s of main.children) s.hidden = s.dataset.league !== alias;
  if (push) history.replaceState(null, "", "#" + alias);
}
const fromHash = location.hash.slice(1);
show(LEAGUES.some(L => L.alias === fromHash) ? fromHash : LEAGUES[0].alias);
document.getElementById("foot").textContent = `Data from Leghe Fantacalcio, ${date(LEAGUES[0].fetched_at)}.`;
</script>
