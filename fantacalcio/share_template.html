<title>Riccardo's Fantacalcio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one league at a time behind a switch; the leaderboard, then the round: live while it is played,
   otherwise the last result, with both line-ups of my match and every other match one line away */
:root {
  --bg: #eef1ec; --surface: #ffffff; --ink: #17201a; --muted: #5d6a61; --line: #d9dfd8;
  --accent: #1f6b41; --me: #fff1b8; --me-ink: #6b4e00;
  --role-p: #d98a1f; --role-d: #2f8a4f; --role-c: #2c66c9; --role-a: #cf3e31;
  --win: #1f7a43; --draw: #8a948c; --loss: #c0392b;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111612; --surface: #1a211c; --ink: #e8eee9; --muted: #98a59c; --line: #2b352e;
    --accent: #5cc48a; --me: #3b3413; --me-ink: #f5d76e;
    --win: #4ccd7f; --draw: #8f9a92; --loss: #ef6b5c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111612; --surface: #1a211c; --ink: #e8eee9; --muted: #98a59c; --line: #2b352e;
  --accent: #5cc48a; --me: #3b3413; --me-ink: #f5d76e;
  --win: #4ccd7f; --draw: #8f9a92; --loss: #ef6b5c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* league switch */
.switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.switch button { all: unset; cursor: pointer; padding: 12px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 2px; }
.switch button[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch .lg { font: 600 13px var(--body); color: var(--muted); }
.switch .tm { font: 700 22px/1.1 var(--display); }

/* hero */
.hero { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; padding-block: 8px; }
.hero h2 { font-size: clamp(34px, 6vw, 56px); line-height: .95; letter-spacing: -.01em; text-transform: uppercase; }
.hero .sub { color: var(--muted); margin-top: 6px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.fact { display: grid; gap: 2px; }
.fact b { font: 700 40px/1 var(--display); font-variant-numeric: tabular-nums; }
.fact b sup { font-size: 20px; }
.fact span { font-size: 13px; color: var(--muted); }
.form { display: inline-flex; gap: 4px; }
.r { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; font: 700 12px var(--display); color: #fff; }
.r.W { background: var(--win); } .r.D { background: var(--draw); } .r.L { background: var(--loss); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.panel h3 { font-size: 22px; text-transform: uppercase; letter-spacing: .02em; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.panel h3 small { font: 500 13px var(--body); color: var(--muted); text-transform: none; letter-spacing: 0; }

/* standings */
.scroll { overflow-x: auto; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 6px 6px; border-bottom: 1px solid var(--line); }
td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:nth-child(2), td:nth-child(2) { text-align: left; }
td.pos { font: 700 18px var(--display); text-align: center; width: 34px; color: var(--muted); }
tr:first-child td.pos { color: var(--accent); }
td.team { font-weight: 600; white-space: normal; min-width: 130px; }
td.pts { font: 700 20px var(--display); }
td.fp { min-width: 92px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
.bar i { display: block; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.bar i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--accent); border-radius: 3px; }
tr.me td { background: var(--me); color: var(--me-ink); }
tr.me td.pos { color: var(--me-ink); }
tr.me .bar i::after { background: var(--me-ink); }
.key { font-size: 12px; color: var(--muted); margin-top: 10px; }

/* the round: my match in full, the others one line each that open */
.round-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.live { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--loss); color: #fff; font: 700 12px var(--body); letter-spacing: .08em; text-transform: uppercase; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
@media (prefers-reduced-motion: no-preference) { .live::before { animation: pulse 1.4s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .3; } } }
.score { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; margin-top: 14px; padding: 14px 0; border-block: 1px solid var(--line); }
.score .side { display: grid; gap: 2px; min-width: 0; }
.score .side.away { text-align: right; }
.score .tm { font: 700 20px/1.1 var(--display); overflow-wrap: anywhere; }
.score .tot { font: 700 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.score .goals { font: 700 40px/1 var(--display); font-variant-numeric: tabular-nums; text-align: center; }
.score .goals small { display: block; font: 500 12px var(--body); color: var(--muted); }
.score .me .tm { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.xis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 12px; }
@media (max-width: 760px) { .xis { grid-template-columns: minmax(0, 1fr); } }
.xi h4 { font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.xi h4 small { font: 500 12px var(--body); color: var(--muted); text-transform: none; letter-spacing: 0; }
.xi ol { list-style: none; margin: 0; padding: 0; }
.xi li { display: grid; grid-template-columns: 26px minmax(0, 1fr) 36px 40px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.xi li.off .nm { text-decoration: line-through; text-decoration-thickness: 1px; }
.xi .ro { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 11px/1 var(--display); }
.xi .who { min-width: 0; }
.xi .nm { display: block; font: 600 15px/1.2 var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xi .ev { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xi .v, .xi .fv { text-align: right; font-variant-numeric: tabular-nums; }
.xi .v { color: var(--muted); font-size: 14px; }
.xi .fv { font: 700 17px var(--display); }
.xi .sub-h { font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px; }
.xi .cols-h { display: grid; grid-template-columns: 26px minmax(0, 1fr) 36px 40px; gap: 8px; font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.xi .cols-h span:nth-child(n+3) { text-align: right; }
.others { margin-top: 18px; display: grid; gap: 8px; }
.others h4 { font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 0; }
.others details { border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.others summary { cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 0; list-style: none; }
.others summary::-webkit-details-marker { display: none; }
.others summary .aw { text-align: right; }
.others summary b { font-variant-numeric: tabular-nums; }
.others summary .mid { text-align: center; font: 700 16px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.others details[open] summary { border-bottom: 1px solid var(--line); }
.others details .xis { margin-bottom: 12px; }
.round-key { font-size: 12px; color: var(--muted); margin-top: 10px; }
.wait { color: var(--muted); padding: 24px 0; }
.P { background: var(--role-p); } .D { background: var(--role-d); } .C { background: var(--role-c); } .A { background: var(--role-a); }
@media (max-width: 480px) { .wide { display: none; } td.fp { min-width: 0; } .bar { grid-template-columns: auto; } .bar i { display: none; } .score .tm { font-size: 16px; } .score .tot { font-size: 24px; } .score .goals { font-size: 30px; } }
footer { font-size: 12px; color: var(--muted); text-align: center; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { section[data-league] { animation: in .25s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } } }
</style>

<div class="wrap">
  <header style="display:grid;gap:12px">
    <div class="eyebrow">Fantacalcio · Riccardo Rao</div>
    <div class="switch" role="tablist" aria-label="League" id="switch"></div>
  </header>
  <main id="leagues"><p class="wait">Fetching the table from Leghe Fantacalcio…</p></main>
  <footer id="foot"></footer>
</div>

<script>
// The data: written in by `fanta.py share` (LEAGUES), or, when SOURCE is set, fetched from that URL on
// every visit — and again every minute while a round is live and the page is on screen.
const LEAGUES = /*__DATA__*/null;
const SOURCE = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const n = v => v == null ? "–" : Number.isInteger(v) ? v : (+v).toFixed(1).replace(/\.0$/, "");
const date = s => { const d = new Date(String(s).replace(" ", "T")); return isNaN(d) ? s : d.toLocaleDateString("en-GB", {day: "numeric", month: "short", year: "numeric"}); };
const time = s => { const d = new Date(String(s).replace(" ", "T")); return isNaN(d) ? "" : d.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"}); };
const sw = document.getElementById("switch"), main = document.getElementById("leagues");

// events in words, never in colour alone: "Goal ×2 · Assist · Yellow card". The in/out flags are the
// fantasy substitutions (a starter without a vote replaced from the bench), not the real ones; while a
// round is live a starter whose club has not played yet is provisionally out, so he is "yet to play".
const EV = [["goal", "Goal"], ["pen_goal", "Penalty goal"], ["assist", "Assist"], ["own_goal", "Own goal"], ["pen_missed", "Penalty missed"],
  ["pen_saved", "Penalty saved"], ["conceded", "Conceded"], ["clean_sheet", "Clean sheet"], ["yellow", "Yellow card"], ["red", "Red card"]];
const waiting = (p, live) => live && p.vote == null && !p.sv;
const events = (p, live) => [...EV.filter(([k]) => p.events?.[k]).map(([k, w]) => w + (p.events[k] > 1 ? " ×" + p.events[k] : "")),
  waiting(p, live) ? "Yet to play" : p.off ? "No vote · replaced" : p.sv ? "No vote" : "",
  p.on && !live ? "Came in" : ""].filter(Boolean).join(" · ");

function lineup(t, me, live) {
  const xi = t.players.filter(p => p.starter), on = t.players.filter(p => !p.starter && p.on);
  const row = p => `<li class="${p.off && !waiting(p, live) ? "off" : ""}"><span class="ro ${p.line}" title="${esc(p.role)}">${esc(p.role || "?")}</span>
    <span class="who"><span class="nm">${esc(p.name)}</span><span class="ev">${esc([p.club, events(p, live)].filter(Boolean).join(" · "))}</span></span>
    <span class="v">${p.vote == null ? "–" : n(p.vote)}</span><span class="fv">${p.fv == null ? "–" : n(p.fv)}</span></li>`;
  return `<div class="xi"><h4>${esc(t.team)}${me ? " ★" : ""} <small>${esc(t.formation.split("").join("-"))}</small></h4>
    <div class="cols-h" aria-hidden="true"><span></span><span>Player</span><span>Vote</span><span>FV</span></div>
    <ol>${xi.map(row).join("")}</ol>${on.length ? `<div class="sub-h">${live ? "Coming in, so far" : "Came in"}</div><ol>${on.map(row).join("")}</ol>` : ""}</div>`;
}

function roundPanel(L) {
  const R = L.matchday;
  if (!R || !R.matches.length) return `<div class="panel round"><h3>Last round</h3><p class="round-key">No round played yet.</p></div>`;
  const mine = R.mine != null ? R.matches[R.mine] : null, others = R.matches.filter((m, i) => i !== R.mine);
  const isMe = t => t.id === L.my_team;
  const goals = m => m.goals ? m.goals.join("–") : "–";
  return `<div class="panel round" data-round="${R.round}">
    <div class="round-head"><h3>${R.live ? "Round " + R.round + ", live" : "Round " + R.round + " result"}</h3>
      ${R.live ? `<span class="live">Live</span><small class="round-key" style="margin:0">updated ${esc(time(R.fetched_at))}, every minute</small>` : `<small class="round-key" style="margin:0">Serie A round ${esc(R.serie_a_round)}</small>`}</div>
    ${mine ? `<div class="score">
      <div class="side ${isMe(mine.home) ? "me" : ""}"><span class="tm">${esc(mine.home.team)}</span><span class="tot">${n(mine.home.total)}</span></div>
      <div class="goals">${goals(mine)}<small>${R.live ? "so far" : "goals"}</small></div>
      <div class="side away ${isMe(mine.away) ? "me" : ""}"><span class="tm">${esc(mine.away.team)}</span><span class="tot">${n(mine.away.total)}</span></div>
    </div>
    <div class="xis">${lineup(mine.home, isMe(mine.home), R.live)}${lineup(mine.away, isMe(mine.away), R.live)}</div>` : ""}
    ${others.length ? `<div class="others"><h4>${mine ? "The other matches" : "The matches"}</h4>${others.map((m, i) => `
      <details data-key="${esc(m.home.id + "-" + m.away.id)}"><summary><span>${esc(m.home.team)} <b>${n(m.home.total)}</b></span><span class="mid">${goals(m)}</span><span class="aw"><b>${n(m.away.total)}</b> ${esc(m.away.team)}</span></summary>
      <div class="xis">${lineup(m.home, false, R.live)}${lineup(m.away, false, R.live)}</div></details>`).join("")}</div>` : ""}
    <div class="round-key">Vote: the player's mark. FV: fantasy vote, the mark with bonus and malus, which makes the team's total.${R.live ? " Live totals are provisional until Leghe calculates the round." : ""}</div>
  </div>`;
}

function render(data) {
  sw.textContent = ""; main.textContent = "";
  data.forEach(L => {
    const me = L.standings.find(s => s.id === L.my_team) || {};
    const maxFp = Math.max(...L.standings.map(s => s.fp || 0)) || 1;
    const b = document.createElement("button");
    b.setAttribute("role", "tab"); b.id = "tab-" + L.alias; b.dataset.alias = L.alias;
    b.innerHTML = `<span class="lg">${esc(L.name)} · ${me.pos ?? "–"}° of ${L.standings.length}${L.matchday?.live ? " · live" : ""}</span><span class="tm">${esc(L.squad.team)}</span>`;
    b.onclick = () => show(L.alias, true);
    sw.append(b);
    const sec = document.createElement("section");
    sec.dataset.league = L.alias; sec.setAttribute("role", "tabpanel"); sec.setAttribute("aria-labelledby", "tab-" + L.alias);
    sec.innerHTML = `
      <div class="hero">
        <div>
          <div class="eyebrow">${[L.name, L.type, L.competition !== L.name ? L.competition : ""].filter(Boolean).map(esc).join(" · ")}</div>
          <h2>${esc(L.squad.team)}</h2>
          <div class="sub">After ${L.rounds_played} round${L.rounds_played === 1 ? "" : "s"} · updated ${esc(date(L.fetched_at))}</div>
        </div>
        <div class="facts">
          <div class="fact"><b>${me.pos ?? "–"}<sup>°</sup></b><span>of ${L.standings.length}</span></div>
          <div class="fact"><b>${n(me.pts)}</b><span>points</span></div>
          <div class="fact"><b>${n(me.fp)}</b><span>fantasy points</span></div>
          ${me.form ? `<div class="fact"><span class="form" style="height:40px;align-items:center">${[...me.form].map(r => `<i class="r ${r}" title="${r === "W" ? "Won" : r === "L" ? "Lost" : "Drawn"}">${r}</i>`).join("")}</span><span>form</span></div>` : ""}
        </div>
      </div>
      <div class="panel">
        <h3>Leaderboard <small>${esc(L.competition)}</small></h3>
        <div class="scroll"><table>
          <thead><tr><th style="text-align:center">#</th><th>Team</th><th title="Played">P</th><th class="wide" title="Won">W</th><th class="wide" title="Drawn">D</th><th class="wide" title="Lost">L</th><th class="wide" title="Goals for–against">Goals</th><th title="Points">Pts</th><th title="Fantasy points">FP</th></tr></thead>
          <tbody>${L.standings.map(s => `<tr class="${s.id === L.my_team ? "me" : ""}">
            <td class="pos">${s.pos}</td><td class="team">${esc(s.team)}</td><td>${n(s.played)}</td><td class="wide">${n(s.w)}</td><td class="wide">${n(s.d)}</td><td class="wide">${n(s.l)}</td>
            <td class="wide">${n(s.gf)}–${n(s.ga)}</td><td class="pts">${n(s.pts)}</td>
            <td class="fp"><span class="bar"><i style="--w:${(100 * (s.fp || 0) / maxFp).toFixed(1)}%"></i>${n(s.fp)}</span></td></tr>`).join("")}</tbody>
        </table></div>
        <div class="key">Pts: league points (3 for a win, 1 for a draw). FP: fantasy points scored in total, the usual tie-breaker.</div>
      </div>
      ${roundPanel(L)}`;
    main.append(sec);
  });
  const fromHash = location.hash.slice(1);
  show(current && data.some(L => L.alias === current) ? current : data.some(L => L.alias === fromHash) ? fromHash : data[0].alias);
  document.getElementById("foot").textContent = `${SOURCE ? "Live" : "Data"} from Leghe Fantacalcio, ${date(data[0].fetched_at)}.`;
}

let current = null;
function show(alias, push) {
  current = alias;
  for (const b of sw.children) b.setAttribute("aria-selected", String(b.dataset.alias === alias));
  for (const s of main.children) s.hidden = s.dataset.league !== alias;
  if (push) history.replaceState(null, "", "#" + alias);
}

// a refresh while live keeps what the reader opened
function refresh(data) {
  const open = new Set([...document.querySelectorAll(".others details[open]")].map(d => d.dataset.key));
  render(data);
  document.querySelectorAll(".others details").forEach(d => { if (open.has(d.dataset.key)) d.open = true; });
}
function load() {
  return fetch(SOURCE).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => { refresh(d.leagues); return d.leagues; });
}
if (SOURCE) {
  load().then(data => {
    if (!data.some(L => L.matchday?.live)) return;
    setInterval(() => { if (!document.hidden) load().catch(() => {}); }, 60000);
  }, () => { main.innerHTML = '<p class="wait">The league is not reachable right now. Try again in a few minutes.</p>'; });
} else render(LEAGUES);
</script>
